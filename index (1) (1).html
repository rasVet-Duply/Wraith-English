<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WRAITH ENGLISH — IELTS Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #f4f6fb;
    --surface: #ffffff;
    --surface-2: #eef1f8;
    --surface-hover: #e6eaf6;
    --border: rgba(24,34,66,.09);
    --text: #16203a;
    --text-dim: #5b6478;
    --text-faint: #97a1b6;

    --btn: #26399a;
    --btn-deep: #1c2c78;
    --btn-hover: #3a4fc9;
    --btn-text: #ffffff;

    --accent: #3d5bef;
    --accent-soft: rgba(61,91,239,.10);
    --accent-glow: rgba(61,91,239,.28);

    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --ease: cubic-bezier(.22,.9,.32,1);
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background: radial-gradient(120% 140% at 20% -10%, #ffffff 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }
  ::selection{ background: var(--accent-soft); color: var(--text); }
  button, input{ font-family: inherit; }
  input{
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: .92rem;
    outline: none;
    transition: border-color .2s ease, background-color .2s ease;
  }
  input:focus{ border-color: var(--accent); background: var(--surface); }

  /* ============ AUTH ============ */
  #auth{
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #auth.hidden{ display: none; }
  .auth-card{
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 34px 32px;
    box-shadow: 0 20px 50px -24px rgba(20,30,70,.18);
  }
  .auth-brand{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-bottom: 22px;
  }
  .auth-brand img{ width: 130px; height: auto; margin-bottom: 8px; }
  .auth-brand .b1{
    font-family: 'Cinzel', serif;
    font-weight: 700;
    letter-spacing: .28em;
    font-size: 1rem;
  }
  .auth-brand .b2{
    font-size: .62rem;
    letter-spacing: .18em;
    color: var(--text-faint);
    margin-top: 3px;
  }
  .auth-tabs{
    display: flex;
    background: var(--surface-2);
    border-radius: 999px;
    padding: 4px;
    margin-bottom: 22px;
  }
  .auth-tab{
    flex: 1;
    text-align: center;
    padding: 9px 0;
    border-radius: 999px;
    font-size: .82rem;
    font-weight: 700;
    color: var(--text-faint);
    cursor: pointer;
    transition: all .2s ease;
    background: transparent;
    border: none;
  }
  .auth-tab.active{
    background: var(--btn);
    color: #fff;
    box-shadow: 0 6px 16px -8px rgba(38,57,154,.5);
  }
  .field{ margin-bottom: 14px; }
  .field label{
    display: block;
    font-size: .74rem;
    color: var(--text-dim);
    margin-bottom: 6px;
    letter-spacing: .02em;
  }
  .auth-btn{
    width: 100%;
    padding: 13px 0;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--btn);
    color: #fff;
    font-weight: 700;
    font-size: .92rem;
    cursor: pointer;
    margin-top: 6px;
    transition: background-color .2s ease, transform .2s var(--ease);
  }
  .auth-btn:hover{ background: var(--btn-hover); transform: translateY(-1px); }
  .auth-link{
    text-align: center;
    font-size: .8rem;
    color: var(--text-faint);
    margin-top: 14px;
    cursor: pointer;
  }
  .auth-link span{ color: var(--accent); font-weight: 700; }
  .auth-msg{
    font-size: .78rem;
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    margin-bottom: 14px;
    line-height: 1.5;
  }
  .auth-msg.error{ background: rgba(230,60,80,.08); color: #c23a52; }
  .auth-msg.info{ background: var(--accent-soft); color: var(--btn); }
  .auth-step{ display: none; }
  .auth-step.active{ display: block; }
  .code-boxes{ display:flex; gap:8px; }
  .code-boxes input{
    text-align: center;
    font-size: 1.1rem;
    font-weight: 700;
    padding: 12px 0;
  }

  /* ============ APP SHELL ============ */
  #app{ display: none; min-height: 100vh; }
  #app.visible{ display: flex; }
  .shell{ display: flex; width: 100%; min-height: 100vh; }

  /* ---- Sidebar 25% ---- */
  .sidebar{
    width: 25%;
    min-width: 280px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 34px 22px 28px;
    display: flex;
    flex-direction: column;
  }

  .brand{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
    padding: 6px 6px 24px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
  }
  .brand-mark{
    width: 100%;
    max-width: 160px;
    height: auto;
    object-fit: contain;
  }
  .brand-text{ display: flex; align-items: baseline; gap: .5em; }
  .brand-text .b1{
    font-family: 'Cinzel', serif;
    font-size: 1.05rem;
    letter-spacing: .28em;
    color: var(--text);
    font-weight: 700;
  }
  .brand-text .b2{
    font-size: .6rem;
    letter-spacing: .18em;
    color: var(--text-faint);
  }

  .nav-label{
    font-size: .68rem;
    letter-spacing: .18em;
    color: var(--text-faint);
    padding: 0 8px;
    margin-bottom: 12px;
  }
  .nav{ display: flex; flex-direction: column; gap: 12px; }

  .nav-btn{
    position: relative;
    background: var(--btn);
    border: 1px solid transparent;
    border-radius: var(--radius-lg);
    padding: 16px 18px;
    text-align: left;
    color: rgba(255,255,255,.82);
    cursor: pointer;
    transition: transform .28s var(--ease), background-color .28s var(--ease), color .2s ease, box-shadow .28s var(--ease);
    display: flex;
    align-items: center;
    gap: 12px;
    overflow: hidden;
  }
  .nav-btn .ic{ width: 20px; height: 20px; flex-shrink: 0; opacity: .8; transition: opacity .25s ease; }
  .nav-btn .lbl{ font-size: .93rem; font-weight: 700; letter-spacing: .01em; }
  .nav-btn .sub{
    display: block;
    font-size: .7rem;
    font-weight: 500;
    color: rgba(255,255,255,.55);
    margin-top: 2px;
  }
  .nav-btn:hover{
    background: var(--btn-hover);
    transform: translateY(-2px) scale(1.035);
    box-shadow: 0 14px 26px -12px rgba(38,57,154,.45);
    color: #fff;
  }
  .nav-btn:hover .ic{ opacity: 1; }
  .nav-btn:active{ transform: translateY(-1px) scale(1.01); }
  .nav-btn.active{
    background: var(--accent);
    color: #fff;
    box-shadow: 0 14px 26px -12px rgba(61,91,239,.5);
  }
  .nav-btn.active::before{
    content: "";
    position: absolute; left: 0; top: 14%; bottom: 14%;
    width: 3px; background: #fff; border-radius: 3px;
  }
  .nav-btn.variant-dark{ background: var(--btn-deep); }
  .nav-btn.variant-dark:hover{ background: var(--btn-hover); }

  .sidebar-foot{
    margin-top: auto;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: .74rem;
    color: var(--text-dim);
  }
  .sidebar-foot .user-email{ font-weight: 700; color: var(--text); word-break: break-all; }
  .sidebar-foot .logout{
    display: inline-block;
    margin-top: 8px;
    color: var(--accent);
    font-weight: 700;
    cursor: pointer;
  }

  /* ---- Content 75% ---- */
  .content{ width: 75%; padding: 40px 52px; display: flex; flex-direction: column; }
  .content-head{
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 28px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .content-head h1{
    font-family: 'Cinzel', serif;
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  .content-head p{ color: var(--text-dim); font-size: .9rem; margin-top: 6px; }
  .crumb{ font-size: .74rem; color: var(--text-faint); letter-spacing: .06em; cursor: pointer; }
  .crumb span{ color: var(--accent); }
  .crumb:hover{ color: var(--text-dim); }

  .pane{ animation: paneIn .45s var(--ease); }
  @keyframes paneIn{ from{ opacity: 0; transform: translateY(10px);} to{ opacity: 1; transform: translateY(0);} }

  .add-btn{
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--btn);
    color: #fff;
    border: none;
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color .2s ease, transform .2s var(--ease);
    box-shadow: 0 10px 20px -10px rgba(38,57,154,.5);
  }
  .add-btn:hover{ background: var(--btn-hover); transform: translateY(-2px) scale(1.06); }

  .placeholder-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 48px 36px;
    text-align: center;
    max-width: 560px;
    box-shadow: 0 10px 30px -20px rgba(20,30,70,.15);
  }
  .placeholder-card .glyph{ width: 46px; height: 46px; margin: 0 auto 18px; opacity: .7; }
  .placeholder-card h3{ font-family: 'Cinzel', serif; font-size: 1.15rem; margin-bottom: 10px; }
  .placeholder-card p{ color: var(--text-dim); font-size: .88rem; line-height: 1.6; }

  .upload-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 26px 30px;
    max-width: 560px;
    box-shadow: 0 10px 30px -20px rgba(20,30,70,.15);
  }
  .upload-card .file-row{
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin-top: 14px;
  }
  .upload-card .file-name{ font-weight: 700; font-size: .9rem; flex: 1; word-break: break-all; }
  .upload-card .file-meta{ font-size: .74rem; color: var(--text-faint); margin-top: 2px; }
  .file-actions{ display: flex; gap: 8px; margin-top: 14px; }
  .mini-btn{
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .mini-btn.primary{ background: var(--btn); color: #fff; border-color: transparent; }
  .mini-btn.primary:hover{ background: var(--btn-hover); }
  .mini-btn.danger{ color: #c23a52; }
  .admin-note{ font-size: .74rem; color: var(--text-faint); margin-top: 14px; line-height: 1.5; }

  /* Custom Mock list */
  .mock-grid{ display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; max-width: 900px; }
  .mock-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px;
    cursor: pointer;
    transition: transform .25s var(--ease), background-color .25s ease, box-shadow .25s ease;
  }
  .mock-card:hover{ background: var(--surface-hover); transform: translateY(-3px); box-shadow: 0 14px 26px -16px rgba(20,30,70,.25); }
  .mock-card .name{ font-weight: 700; font-size: .98rem; margin-bottom: 6px;}
  .mock-card .meta{ font-size: .76rem; color: var(--text-faint); }
  .mock-card.add{
    display: flex; align-items: center; justify-content: center;
    border-style: dashed;
    color: var(--text-faint);
    font-size: .85rem;
    font-weight: 700;
  }
  .mock-card.add:hover{ color: var(--accent); border-color: var(--accent); }

  /* Custom Mock config */
  .config-grid{ display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 780px; }
  @media (max-width: 900px){ .config-grid{ grid-template-columns: 1fr; } }

  .skill-card{
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 20px 18px;
    transition: background-color .35s ease, opacity .35s ease, filter .35s ease;
    box-shadow: 0 10px 30px -22px rgba(20,30,70,.15);
  }
  .skill-card.disabled{ background: var(--surface-2); filter: grayscale(1) opacity(.55); }
  .skill-card .sk-head{ display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .skill-card .sk-title{ font-weight: 700; font-size: 1rem; }
  .skill-card .sk-status{ font-size: .68rem; letter-spacing: .05em; color: var(--text-faint); }
  .skill-card.disabled .sk-status::before{ content: "OFF · "; }
  .skill-card:not(.disabled) .sk-status::before{ content: "ON · "; color: var(--accent); }

  .parts{ display: flex; flex-wrap: wrap; gap: 8px; }
  .part-chip{
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-faint);
    font-size: .78rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .22s ease;
    user-select: none;
  }
  .part-chip.on{ background: var(--accent-soft); border-color: var(--accent); color: var(--btn); }
  .part-chip:hover{ transform: translateY(-1px); }

  .order-box{
    max-width: 780px;
    margin-top: 26px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 18px 22px;
  }
  .order-box h4{ font-size: .76rem; letter-spacing: .08em; color: var(--text-faint); margin-bottom: 12px; }
  .order-list{ display: flex; flex-direction: column; gap: 8px; }
  .order-item{ display: flex; gap: 10px; align-items: baseline; font-size: .86rem; }
  .order-item .num{ color: var(--accent); font-weight: 700; width: 18px; }
  .order-item .nm{ font-weight: 700; }
  .order-item .pt{ color: var(--text-faint); font-size: .78rem; }
  .order-empty{ color: var(--text-faint); font-size: .82rem; }

  .actions-row{ display: flex; gap: 12px; margin-top: 24px; }

  .pane-fill{ display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .subnav{ display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .subnav-btn{
    padding: 10px 20px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    font-weight: 700;
    font-size: .85rem;
    cursor: pointer;
    transition: all .2s ease;
  }
  .subnav-btn:hover{ border-color: var(--accent); color: var(--text); }
  .subnav-btn.active{ background: var(--btn); color: #fff; border-color: transparent; }
  .subnav-btn.soon{ opacity: .5; cursor: default; }
  .subnav-btn.soon:hover{ border-color: var(--border); color: var(--text-dim); }

  /* Colored passage tabs — Passage 1 blue / Passage 2 purple / Passage 3 red */
  .subnav-btn.c-blue{ background: linear-gradient(135deg,#3d5bef,#2740c9); color:#fff; border-color: transparent; box-shadow: 0 8px 18px -10px rgba(45,70,220,.55); }
  .subnav-btn.c-blue:hover{ background: linear-gradient(135deg,#4d6bff,#2f4be0); color:#fff; }
  .subnav-btn.c-purple{ background: linear-gradient(135deg,#9159f0,#6d33d6); color:#fff; border-color: transparent; box-shadow: 0 8px 18px -10px rgba(120,50,220,.5); }
  .subnav-btn.c-purple:hover{ background: linear-gradient(135deg,#a06bf7,#7a3ce0); color:#fff; }
  .subnav-btn.c-red{ background: linear-gradient(135deg,#ef6a5f,#d8412f); color:#fff; border-color: transparent; box-shadow: 0 8px 18px -10px rgba(215,60,40,.5); }
  .subnav-btn.c-red:hover{ background: linear-gradient(135deg,#f5786d,#e2503b); color:#fff; }
  .subnav-btn.c-orange{ background: linear-gradient(135deg,#f59e42,#d9770a); color:#fff; border-color: transparent; box-shadow: 0 8px 18px -10px rgba(220,140,10,.5); }
  .subnav-btn.c-orange:hover{ background: linear-gradient(135deg,#ffab55,#e8850f); color:#fff; }
  .subnav-btn.c-blue.active, .subnav-btn.c-purple.active, .subnav-btn.c-red.active, .subnav-btn.c-orange.active{ outline: 2px solid rgba(255,255,255,.55); outline-offset: -4px; }

  .tool-frame-wrap{
    flex: 1;
    min-height: 640px;
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px -20px rgba(20,30,70,.15);
    background: #fff;
  }
  .tool-frame-wrap iframe{ width: 100%; height: 100%; min-height: 640px; border: none; display: block; }

  .full-list{ display: flex; flex-direction: column; gap: 10px; max-width: 420px; }
  .full-item{
    padding: 14px 18px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-weight: 700;
    transition: all .2s ease;
  }
  .full-item:hover{ background: var(--surface-hover); border-color: var(--accent); }
  .full-item.active{ background: var(--btn); color: #fff; border-color: transparent; }

  .btn{
    padding: 12px 26px;
    border-radius: 999px;
    border: none;
    background: var(--btn);
    color: #fff;
    font-weight: 700;
    font-size: .86rem;
    cursor: pointer;
    transition: transform .2s var(--ease), background-color .2s ease;
  }
  .btn:hover{ transform: translateY(-2px); background: var(--btn-hover); }
  .btn.primary{ background: var(--accent); }
  .btn.primary:hover{ background: #5b76f3; }
  .btn.ghost{ background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .btn.ghost:hover{ color: var(--text); border-color: var(--accent); background: transparent; }

  /* ============ FULLSCREEN TOOL MODE (Reading passage / Full test / Writing) ============ */
  #app.fs-tool .sidebar{ display:none; }
  #app.fs-tool .acct-fab, #app.fs-tool .acct-popover{ display:none; }
  #app.fs-tool .logo-fab{ display:none; }
  #app.fs-tool .content{ width:100%; padding:0; }
  .fs-tool-wrap{
    position: fixed;
    inset: 0;
    z-index: 60;
    display: flex;
    background: #fff;
    animation: fsIn .32s var(--ease);
  }
  @keyframes fsIn{ from{ opacity:0; } to{ opacity:1; } }
  .fs-iframe{ flex:1; width:100%; height:100%; border:none; display:block; }
  .fs-exit-btn{
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 65;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--btn);
    color: #fff;
    border: 2px solid #fff;
    font-size: 1.25rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px -8px rgba(38,57,154,.55);
    transition: transform .2s var(--ease), background-color .2s ease, box-shadow .2s ease;
  }
  .fs-exit-btn:hover{ background: var(--btn-hover); transform: translateX(-2px) scale(1.06); box-shadow: 0 14px 30px -10px rgba(38,57,154,.6); }
  .fs-exit-btn:active{ transform: scale(.95); }
  .fs-exit-btn svg{ width:20px; height:20px; }

  /* ---- Reading picker: nicer full-test cards ---- */
  .full-list{ display:grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 16px; max-width: 900px; }
  .full-item{
    position: relative;
    padding: 22px 20px;
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    cursor: pointer;
    font-weight: 700;
    transition: transform .25s var(--ease), background-color .2s ease, box-shadow .25s ease, border-color .2s ease;
    box-shadow: 0 10px 30px -22px rgba(20,30,70,.2);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .full-item .fi-icon{
    width: 38px; height: 38px;
    border-radius: 50%;
    background: var(--accent-soft);
    color: var(--btn);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 700;
  }
  .full-item .fi-label{ font-size: .98rem; }
  .full-item .fi-sub{ font-size: .74rem; font-weight: 600; color: var(--text-faint); }
  .full-item:hover{ transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 18px 34px -16px rgba(20,30,70,.3); }
  .full-item.active{ background: var(--btn); border-color: transparent; }
  .full-item.active .fi-icon{ background: rgba(255,255,255,.18); color:#fff; }
  .full-item.active .fi-label, .full-item.active .fi-sub{ color:#fff; }

  /* Slow color-shifting border for Mock cards: blue → purple → red → purple → blue */
  .full-item.cycle-border, .mock-card.cycle-border{
    border: 2px solid transparent;
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(120deg, #3d5bef, #9159f0, #ef6a5f, #9159f0, #3d5bef);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    background-size: 100% 100%, 400% 400%;
    animation: borderCycle 14s ease-in-out infinite;
  }
  .full-item.cycle-border:hover, .mock-card.cycle-border:hover{ transform: translateY(-4px); }
  @keyframes borderCycle{
    0%{ background-position: 0% 0%, 0% 50%; }
    50%{ background-position: 0% 0%, 100% 50%; }
    100%{ background-position: 0% 0%, 0% 50%; }
  }

  /* Writing tool cards — same animated-border treatment as Full Test, but blue only */
  .full-item.cycle-border-blue{
    border: 2px solid transparent;
    background-image:
      linear-gradient(var(--surface), var(--surface)),
      linear-gradient(120deg, #1c2c78, #3d5bef, #7c93ff, #3d5bef, #1c2c78);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    background-size: 100% 100%, 400% 400%;
    animation: borderCycle 14s ease-in-out infinite;
  }
  .full-item.cycle-border-blue:hover{ transform: translateY(-4px); }

  /* ============ FLOATING LOGO BUTTON (links to Telegram channel) ============ */
  .logo-fab{
    position: fixed;
    left: 26px;
    bottom: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    z-index: 70;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 10px 26px -12px rgba(38,57,154,.4);
    transition: transform .24s var(--ease), box-shadow .24s ease, border-color .24s ease;
  }
  .logo-fab img{ width: 72%; height: 72%; object-fit: contain; pointer-events: none; }
  .logo-fab:hover{
    transform: translateY(-2px) scale(1.14);
    box-shadow: 0 18px 36px -14px rgba(38,57,154,.55);
    border-color: var(--accent);
  }
  .logo-fab:active{ transform: scale(1.04); }
  .logo-fab::after{
    content: "";
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    box-shadow: 0 0 0 0 rgba(61,91,239,.35);
    animation: logoPulse 3.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes logoPulse{
    0%{ box-shadow: 0 0 0 0 rgba(61,91,239,.3); }
    70%{ box-shadow: 0 0 0 10px rgba(61,91,239,0); }
    100%{ box-shadow: 0 0 0 0 rgba(61,91,239,0); }
  }

  /* ============ ACCOUNT FAB + POPOVER ============ */
  .acct-fab{
    position: fixed;
    top: 22px;
    right: 28px;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--btn);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', serif;
    font-weight: 700;
    font-size: 1.05rem;
    cursor: pointer;
    z-index: 70;
    box-shadow: 0 10px 24px -10px rgba(38,57,154,.55);
    border: 2px solid var(--surface);
    transition: transform .22s var(--ease), background-color .22s ease, box-shadow .22s ease;
    user-select: none;
  }
  .acct-fab:hover{ background: var(--btn-hover); transform: translateY(-2px) scale(1.05); box-shadow: 0 14px 30px -12px rgba(38,57,154,.6); }
  .acct-fab:active{ transform: translateY(0) scale(.97); }

  .acct-popover{
    position: fixed;
    top: 78px;
    right: 28px;
    width: 300px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 24px 60px -20px rgba(20,30,70,.35);
    padding: 20px;
    z-index: 71;
    opacity: 0;
    transform: translateY(-8px) scale(.98);
    pointer-events: none;
    transition: opacity .2s var(--ease), transform .2s var(--ease);
  }
  .acct-popover.open{
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .acct-head{ display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .acct-avatar-lg{
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.05rem;
    flex-shrink: 0;
  }
  .acct-name{ font-weight: 800; font-size: .94rem; word-break: break-word; }
  .acct-email{ font-size: .74rem; color: var(--text-faint); word-break: break-all; margin-top: 1px; }

  .acct-created{
    background: var(--surface-2);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    font-size: .74rem;
    color: var(--text-dim);
    line-height: 1.6;
    margin-bottom: 16px;
  }
  .acct-created b{ color: var(--text); font-size: .82rem; font-weight: 700; }

  .acct-actions{ display: flex; gap: 10px; margin-bottom: 4px; }
  .acct-btn{
    flex: 1;
    padding: 10px 0;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: .82rem;
    font-weight: 700;
    cursor: pointer;
    transition: all .2s ease;
  }
  .acct-btn:hover{ background: var(--surface-hover); border-color: var(--accent); color: var(--btn); }

  .acct-switcher{
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .acct-row{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: background-color .18s ease;
  }
  .acct-row:hover{ background: var(--surface-2); }
  .acct-row-avatar{
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent-soft);
    color: var(--btn);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: .84rem;
    flex-shrink: 0;
  }
  .acct-row-avatar.plus{ background: var(--btn); color: #fff; font-size: 1.05rem; }
  .acct-row-name{ font-size: .84rem; font-weight: 700; }
  .acct-row-email{ font-size: .7rem; color: var(--text-faint); }
  .acct-row-add{ opacity: .9; }
  .acct-row-add:hover{ opacity: 1; }

  .acct-delete{
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: .8rem;
    font-weight: 700;
    color: #c23a52;
    cursor: pointer;
    text-align: center;
    transition: opacity .18s ease;
  }
  .acct-delete:hover{ opacity: .75; }

  /* ---- delete confirm modal ---- */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(16,22,44,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.visible{ opacity: 1; pointer-events: auto; }
  .confirm-modal{
    width: 100%;
    max-width: 360px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 30px 28px 26px;
    box-shadow: 0 30px 70px -20px rgba(10,15,40,.4);
    transform: translateY(10px) scale(.97);
    transition: transform .22s var(--ease);
  }
  .modal-overlay.visible .confirm-modal{ transform: translateY(0) scale(1); }
  .confirm-modal h3{
    font-family: 'Cinzel', serif;
    font-size: 1.1rem;
    margin-bottom: 10px;
    color: var(--text);
  }
  .confirm-modal p{ font-size: .86rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 22px; }
  .confirm-actions{ display: flex; gap: 12px; }
  .modal-btn{
    flex: 1;
    padding: 12px 0;
    border-radius: 999px;
    font-size: .86rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform .18s var(--ease), background-color .18s ease, opacity .18s ease;
  }
  .modal-btn.cancel{
    background: #e63c50;
    color: #fff;
    border: none;
  }
  .modal-btn.cancel:hover{ background: #d92e43; transform: translateY(-1px); }
  .modal-btn.accept{
    background: #fff;
    color: #16203a;
    border: 2px solid #16203a;
  }
  .modal-btn.accept:hover{ background: #f4f6fb; transform: translateY(-1px); }
  .modal-btn:disabled{ opacity: .6; cursor: default; transform: none; }

  @media (max-width: 860px){
    .shell{ flex-direction: column; }
    .sidebar, .content{ width: 100%; }
    .sidebar{ min-width: 0; }
    .nav{ flex-direction: row; flex-wrap: wrap; }
    .nav-btn{ flex: 1 1 45%; }
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

<script>
(function(){

  /* =====================================================================
     SUPABASE CONFIG — fill these two lines in with your own project's
     values (Supabase dashboard → Settings → API), then re-upload the file.
     ===================================================================== */
  const SUPABASE_URL = 'https://eesqqmqfeititqqxwvfl.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_cFj_C1sIt8XahB3H76Yt1A_JIQypxvp';

  const ADMIN_EMAIL = 'rasvet1pro@gmail.com';
  const BUCKET = 'materials';

  let supabase;
  try{
    if(!window.supabase) throw new Error('SDK не загрузился (нет интернета или CDN заблокирован).');
    if(SUPABASE_URL.includes('YOUR-PROJECT-REF') || SUPABASE_ANON_KEY.includes('YOUR-ANON')){
      throw new Error('Supabase ещё не настроен: впиши SUPABASE_URL и SUPABASE_ANON_KEY в начале файла.');
    }
    supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    document.getElementById('auth').innerHTML =
      `<div class="auth-card"><div class="auth-msg error">${e.message}</div></div>`;
    return;
  }

  /* ================= AUTH (Supabase) ================= */
  const authEl = document.getElementById('auth');
  const appEl = document.getElementById('app');
  const authMsg = document.getElementById('authMsg');

  function showMsg(text, type){
    authMsg.innerHTML = `<div class="auth-msg ${type}">${text}</div>`;
  }
  function clearMsg(){ authMsg.innerHTML = ''; }
  function setBusy(btn, busy, labelBusy, labelNormal){
    btn.disabled = busy;
    btn.textContent = busy ? labelBusy : labelNormal;
  }

  const tabs = { login: document.getElementById('tabLogin'), register: document.getElementById('tabRegister') };
  const steps = {
    login: document.getElementById('stepLogin'),
    register: document.getElementById('stepRegister')
  };
  function showStep(name){
    Object.values(steps).forEach(s=>s.classList.remove('active'));
    steps[name].classList.add('active');
  }
  function goToLoginTab(){
    tabs.login.classList.add('active'); tabs.register.classList.remove('active');
    showStep('login');
  }
  function goToRegisterTab(){
    tabs.register.classList.add('active'); tabs.login.classList.remove('active');
    showStep('register');
  }
  tabs.login.addEventListener('click', ()=>{ clearMsg(); goToLoginTab(); });
  tabs.register.addEventListener('click', ()=>{ clearMsg(); goToRegisterTab(); });

  // ---- login (username + password) ----
  const btnLogin = document.getElementById('btnLogin');
  async function doLogin(){
    const username = document.getElementById('loginUsername').value.trim();
    const pass = document.getElementById('loginPassword').value;
    if(!username || !pass){ showMsg('Заполни логин и пароль.', 'error'); return; }
    clearMsg(); setBusy(btnLogin, true, 'Входим…', 'Войти');

    try{
      // ilike = регистронезависимый поиск, чтобы "Sasha" и "sasha" считались одним логином
      const { data: profile, error: lookupErr } = await supabase
        .from('profiles').select('email').ilike('username', username).maybeSingle();

      if(lookupErr){
        setBusy(btnLogin, false, 'Входим…', 'Войти');
        showMsg('Ошибка базы данных: ' + lookupErr.message, 'error');
        return;
      }
      if(!profile){
        setBusy(btnLogin, false, 'Входим…', 'Войти');
        showMsg('Нет аккаунта с таким логином.', 'error');
        return;
      }

      const { error } = await supabase.auth.signInWithPassword({ email: profile.email, password: pass });
      setBusy(btnLogin, false, 'Входим…', 'Войти');
      if(error){ showMsg(error.message === 'Invalid login credentials' ? 'Неверный пароль.' : error.message, 'error'); return; }
      // onAuthStateChange handles entering the app
    }catch(e){
      setBusy(btnLogin, false, 'Входим…', 'Войти');
      showMsg('Не получилось связаться с сервером: ' + e.message, 'error');
    }
  }
  btnLogin.addEventListener('click', doLogin);
  document.getElementById('loginUsername').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

  // ---- register (email + username + password, one step) ----
  const btnGetStarted = document.getElementById('btnGetStarted');
  async function doRegister(){
    const email = document.getElementById('regEmail').value.trim().toLowerCase();
    const username = document.getElementById('regUsername').value.trim();
    const p1 = document.getElementById('regPassword').value;
    const p2 = document.getElementById('regPassword2').value;

    if(!email || !email.includes('@')){ showMsg('Введи корректную почту.', 'error'); return; }
    if(!username){ showMsg('Придумай логин.', 'error'); return; }
    if(p1.length < 6){ showMsg('Пароль должен быть от 6 символов.', 'error'); return; }
    if(p1 !== p2){ showMsg('Пароли не совпадают.', 'error'); return; }

    clearMsg(); setBusy(btnGetStarted, true, 'Создаём…', 'Get Started');

    try{
      // check email not already registered
      const { data: byEmail, error: byEmailErr } = await supabase.from('profiles').select('username').eq('email', email).maybeSingle();
      if(byEmailErr){
        setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
        showMsg('Ошибка базы данных: ' + byEmailErr.message, 'error');
        return;
      }
      if(byEmail){
        setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
        showMsg(`Эта почта уже используется (логин «${byEmail.username}»). Просто войди — не нужно регистрироваться заново.`, 'error');
        goToLoginTab();
        document.getElementById('loginUsername').value = byEmail.username;
        return;
      }
      // check username not already taken (регистронезависимо)
      const { data: byUsername, error: byUsernameErr } = await supabase.from('profiles').select('username').ilike('username', username).maybeSingle();
      if(byUsernameErr){
        setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
        showMsg('Ошибка базы данных: ' + byUsernameErr.message, 'error');
        return;
      }
      if(byUsername){
        setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
        showMsg('Такой логин уже занят, придумай другой.', 'error');
        return;
      }

      const { data: signUpData, error: signUpErr } = await supabase.auth.signUp({ email, password: p1 });
      if(signUpErr){
        setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
        showMsg('Не получилось создать аккаунт: ' + signUpErr.message, 'error');
        return;
      }
      if(!signUpData.session || !signUpData.user){
        setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
        showMsg('Аккаунт создан, но вход не выполнен автоматически. Проверь в настройках Supabase, что "Confirm email" выключен.', 'error');
        return;
      }

      const { error: profileErr } = await supabase.from('profiles').insert({
        id: signUpData.user.id, username, email
      });
      setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
      if(profileErr){
        showMsg('Аккаунт создан, но логин не сохранился: ' + profileErr.message, 'error');
        return;
      }
      // onAuthStateChange handles entering the app
    }catch(e){
      setBusy(btnGetStarted, false, 'Создаём…', 'Get Started');
      showMsg('Не получилось связаться с сервером: ' + e.message, 'error');
    }
  }
  btnGetStarted.addEventListener('click', doRegister);
  ['regEmail','regUsername','regPassword','regPassword2'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{ if(e.key==='Enter') doRegister(); });
  });

  async function fetchUsername(userId){
    const { data } = await supabase.from('profiles').select('username').eq('id', userId).maybeSingle();
    return data ? data.username : null;
  }

  function enterApp(email, username){
    authEl.classList.add('hidden');
    appEl.classList.add('visible');
    renderUserFoot(email, username);
    document.querySelector('.nav-btn[data-section="reading"]').click();
  }

  function renderUserFoot(email, username){
    const admin = email === ADMIN_EMAIL;
    document.getElementById('sidebarFoot').innerHTML = `
      <div class="user-email">${username || email}${admin ? ' · admin' : ''}</div>
      <span class="logout" id="logoutBtn">Log out</span>`;
    document.getElementById('logoutBtn').addEventListener('click', async ()=>{
      await supabase.auth.signOut();
    });
  }

  let currentUserEmail = null;
  let currentUserId = null;
  let currentUsername = null;
  let currentUserCreatedAt = null;

  /* ---- saved accounts (for quick account switching) ---- */
  const ACCOUNTS_KEY = 'wraith_saved_accounts';
  function loadSavedAccounts(){
    try{ return JSON.parse(localStorage.getItem(ACCOUNTS_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function saveSavedAccounts(list){ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(list)); }
  function upsertSavedAccount(entry){
    const list = loadSavedAccounts();
    const idx = list.findIndex(a => a.user_id === entry.user_id);
    if(idx >= 0) list[idx] = entry; else list.push(entry);
    saveSavedAccounts(list);
  }
  function removeSavedAccount(userId){
    saveSavedAccounts(loadSavedAccounts().filter(a => a.user_id !== userId));
  }

  supabase.auth.onAuthStateChange(async (event, session) => {
    if(session && session.user && session.user.email){
      currentUserEmail = session.user.email;
      currentUserId = session.user.id;
      currentUserCreatedAt = session.user.created_at;
      const username = await fetchUsername(session.user.id);
      currentUsername = username;
      upsertSavedAccount({
        user_id: session.user.id,
        email: session.user.email,
        username: username,
        access_token: session.access_token,
        refresh_token: session.refresh_token
      });
      enterApp(currentUserEmail, username);
    } else {
      currentUserEmail = null;
      currentUserId = null;
      currentUsername = null;
      currentUserCreatedAt = null;
      appEl.classList.remove('visible');
      authEl.classList.remove('hidden');
      clearMsg();
      closeAcctPopover();
      goToLoginTab();
      document.getElementById('loginUsername').value = '';
      document.getElementById('loginPassword').value = '';
    }
  });

  /* ---- account FAB / popover ---- */
  const acctFab = document.getElementById('acctFab');
  const acctPopover = document.getElementById('acctPopover');
  const deleteOverlay = document.getElementById('deleteOverlay');

  function openAcctPopover(){ acctPopover.classList.add('open'); }
  function closeAcctPopover(){ acctPopover.classList.remove('open'); }

  function renderAccountPopover(){
    const created = currentUserCreatedAt ? new Date(currentUserCreatedAt) : null;
    const createdStr = created ? created.toLocaleString('ru-RU', {
      day:'2-digit', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit'
    }) : '—';
    const initial = ((currentUsername || currentUserEmail || '?').trim()[0] || '?').toUpperCase();
    document.getElementById('acctInitial').textContent = initial;

    const others = loadSavedAccounts().filter(a => a.user_id !== currentUserId);
    const othersHtml = others.map(a => `
      <div class="acct-row" data-uid="${a.user_id}">
        <div class="acct-row-avatar">${(a.username || a.email || '?')[0].toUpperCase()}</div>
        <div>
          <div class="acct-row-name">${a.username || a.email}</div>
          <div class="acct-row-email">${a.email}</div>
        </div>
      </div>`).join('');

    acctPopover.innerHTML = `
      <div class="acct-head">
        <div class="acct-avatar-lg">${initial}</div>
        <div>
          <div class="acct-name">${currentUsername || currentUserEmail}</div>
          <div class="acct-email">${currentUserEmail}</div>
        </div>
      </div>
      <div class="acct-created">Account created<br><b>${createdStr}</b></div>
      <div class="acct-actions">
        <button class="acct-btn" id="acctChangeBtn">Change</button>
        <button class="acct-btn" id="acctSignOutBtn">Sign out</button>
      </div>
      <div class="acct-switcher" id="acctSwitcher" style="display:none;">
        ${othersHtml}
        <div class="acct-row acct-row-add" id="acctAddBtn">
          <div class="acct-row-avatar plus">+</div>
          <div class="acct-row-name">Add account</div>
        </div>
      </div>
      <div class="acct-delete" id="acctDeleteBtn">Delete account</div>
    `;

    document.getElementById('acctChangeBtn').addEventListener('click', ()=>{
      const sw = document.getElementById('acctSwitcher');
      sw.style.display = sw.style.display === 'none' ? 'flex' : 'none';
    });

    document.getElementById('acctSignOutBtn').addEventListener('click', async ()=>{
      const uid = currentUserId;
      closeAcctPopover();
      await supabase.auth.signOut();
      removeSavedAccount(uid);
    });

    acctPopover.querySelectorAll('.acct-row[data-uid]').forEach(row=>{
      row.addEventListener('click', async ()=>{
        const uid = row.dataset.uid;
        const acc = loadSavedAccounts().find(a => a.user_id === uid);
        if(!acc) return;
        closeAcctPopover();
        const { error } = await supabase.auth.setSession({
          access_token: acc.access_token,
          refresh_token: acc.refresh_token
        });
        if(error){
          alert('Could not switch to that account — the session expired, please sign in to it again.');
          removeSavedAccount(uid);
        }
      });
    });

    document.getElementById('acctAddBtn').addEventListener('click', async ()=>{
      closeAcctPopover();
      // scope:'local' — просто освобождает экран для входа в другой аккаунт,
      // не отзывая токены уже сохранённых аккаунтов
      await supabase.auth.signOut({ scope: 'local' });
    });

    document.getElementById('acctDeleteBtn').addEventListener('click', ()=>{
      closeAcctPopover();
      deleteOverlay.classList.add('visible');
    });
  }

  acctFab.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(acctPopover.classList.contains('open')){ closeAcctPopover(); }
    else { renderAccountPopover(); openAcctPopover(); }
  });
  document.addEventListener('click', (e)=>{
    if(!acctPopover.classList.contains('open')) return;
    if(!acctPopover.contains(e.target) && !acctFab.contains(e.target)) closeAcctPopover();
  });

  /* ---- delete account ---- */
  document.getElementById('cancelDeleteBtn').addEventListener('click', ()=>{
    deleteOverlay.classList.remove('visible');
  });
  document.getElementById('acceptDeleteBtn').addEventListener('click', async ()=>{
    const btn = document.getElementById('acceptDeleteBtn');
    btn.disabled = true; btn.textContent = 'Deleting…';
    const uid = currentUserId;
    try{
      await supabase.from('profiles').delete().eq('id', uid);
      removeSavedAccount(uid);
      await supabase.auth.signOut();
      // Примечание: анонимный ключ Supabase не может удалить саму запись
      // в auth.users — для полного удаления учётки нужна Edge Function
      // с service_role ключом. Здесь удаляются профиль и данные, и
      // пользователь выходит из системы.
    }catch(err){
      alert('Could not fully delete the account: ' + err.message);
    }
    btn.disabled = false; btn.textContent = 'Accept';
    deleteOverlay.classList.remove('visible');
  });

  /* ================= APP DATA ================= */
  const SKILLS = ['reading','listening','writing','speaking'];
  const LABELS = { reading:'Reading', listening:'Listening', writing:'Writing', speaking:'Speaking' };
  const PARTS = {
    reading:   ['Part 1','Part 2','Part 3'],
    listening: ['Part 1','Part 2','Part 3','Part 4'],
    writing:   ['Task 1','Task 2'],
    speaking:  ['Part 1','Part 2','Part 3']
  };

  function freshConfig(){
    const cfg = {};
    SKILLS.forEach(sk => cfg[sk] = PARTS[sk].map(()=>true));
    return cfg;
  }

  async function getUpload(section){
    const { data, error } = await supabase.from('uploads').select('*').eq('section', section).maybeSingle();
    if(error){ console.error(error); return null; }
    return data;
  }
  async function saveUpload(section, file){
    const path = `${section}/${Date.now()}_${file.name}`;
    const { error: upErr } = await supabase.storage.from(BUCKET).upload(path, file, { upsert: true });
    if(upErr) throw upErr;
    const { data: pub } = supabase.storage.from(BUCKET).getPublicUrl(path);
    const { error: dbErr } = await supabase.from('uploads').upsert({
      section, name: file.name, url: pub.publicUrl, uploaded_at: new Date().toISOString()
    });
    if(dbErr) throw dbErr;
  }
  async function removeUpload(section){
    const { error } = await supabase.from('uploads').delete().eq('section', section);
    if(error) throw error;
  }

  let customMocks = [];
  let mockCounter = 0;
  let currentSection = null;

  const contentEl = document.getElementById('content');
  const navButtons = document.querySelectorAll('.nav-btn');

  function isAdmin(){
    return currentUserEmail === ADMIN_EMAIL;
  }

  function setActiveNav(section){
    navButtons.forEach(b => b.classList.toggle('active', b.dataset.section === section));
  }

  navButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      currentSection = btn.dataset.section;
      setActiveNav(currentSection);
      if(currentSection === 'custommock'){ renderMockList(); }
      else if(currentSection === 'fullmock'){ renderFullMock(); }
      else if(currentSection === 'reading'){ renderReadingSection(); }
      else if(currentSection === 'writing'){ renderWritingSection(); }
      else { renderSkillSection(currentSection); }
    });
  });

  /* ---------- embedded sub-tools (base64, no external file requests) ---------- */
  function getEmbeddedDoc(key){
    const b64 = (window.EMBEDDED_DOCS || {})[key];
    if(!b64){
      return '<p style="padding:24px;font-family:sans-serif;color:#c23a52">Material not found.</p>';
    }
    try{
      const binary = atob(b64);
      const bytes = new Uint8Array(binary.length);
      for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
      return new TextDecoder('utf-8').decode(bytes);
    }catch(e){
      console.error('Не удалось декодировать материал', key, e);
      return '<p style="padding:24px;font-family:sans-serif;color:#c23a52">Error loading material.</p>';
    }
  }

  /* ---------- FULLSCREEN TOOL (used by Reading passages/full tests and Writing) ---------- */
  function enterFullscreenTool(srcdoc, onExit){
    appEl.classList.add('fs-tool');
    contentEl.innerHTML = `
      <div class="fs-tool-wrap">
        <button class="fs-exit-btn" id="fsExitBtn" title="Main menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <iframe class="fs-iframe" id="fsFrame"></iframe>
      </div>`;
    document.getElementById('fsFrame').srcdoc = srcdoc;
    document.getElementById('fsExitBtn').addEventListener('click', ()=>{
      appEl.classList.remove('fs-tool');
      onExit();
    });
  }

  /* ---------- READING (Passage 1 / 2 / 3 + Full Test) ----------
     Each tab (Passage 1 / Passage 2 / Passage 3 / Full Test) shows a
     grid of test cards first — nothing opens immediately. Picking a
     card is what opens it fullscreen, exactly like Full Test already
     did. Passage 3's list starts empty; add more entries to any of
     the arrays below as new material comes in — the grid and the
     fullscreen viewer both pick it up automatically. */
  const READING_PASSAGE_SETS = {
    passage1: [
      { id:'p1-1', label:'Test 1', file:'reading-passage-1.html' }
    ],
    passage2: [
      { id:'p2-1', label:'Test 1', file:'reading-passage-2.html' }
    ],
    passage3: []
  };
  const READING_FULL_TESTS = [
    { id:'full29', label:'Full Test 1', file:'reading-full-29.html' },
    { id:'full34', label:'Full Test 2', file:'reading-full-34.html' },
    { id:'full35', label:'Full Test 3', file:'reading-full-35.html' },
    { id:'full36', label:'Full Test 4', file:'reading-full-36.html' }
  ];

  const READING_TABS = [
    { id:'passage1', label:'Passage 1', color:'c-blue' },
    { id:'passage2', label:'Passage 2', color:'c-purple' },
    { id:'passage3', label:'Passage 3', color:'c-orange' },
    { id:'full',     label:'Full Test', color:'' }
  ];
  let readingActive = 'full';

  function readingList(tabId){
    return tabId === 'full' ? READING_FULL_TESTS : (READING_PASSAGE_SETS[tabId] || []);
  }

  function renderReadingSection(){
    if(!READING_TABS.some(t => t.id === readingActive)) readingActive = 'full';

    const subnavHtml = `
      <div class="subnav">
        ${READING_TABS.map(t => `
          <button class="subnav-btn ${t.color} ${t.id === readingActive ? 'active' : ''}" data-tab="${t.id}">
            ${t.label}
          </button>`).join('')}
      </div>`;

    const items = readingList(readingActive);
    const subLabel = readingActive === 'full' ? 'Reading · 40 questions' : 'Reading';

    const body = items.length
      ? `<div class="full-list">${items.map((it,i)=>`
          <div class="full-item cycle-border" data-id="${it.id}">
            <div class="fi-icon">${i+1}</div>
            <div class="fi-label">${it.label}</div>
            <div class="fi-sub">${subLabel}</div>
          </div>`).join('')}</div>`
      : `<p style="color:var(--text-faint);font-size:.88rem;">Nothing here yet.</p>`;

    contentEl.innerHTML = `
      <div class="content-head">
        <div><h1>Reading</h1></div>
      </div>
      <div class="pane pane-fill">${subnavHtml}${body}</div>`;

    contentEl.querySelectorAll('.subnav-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        readingActive = btn.dataset.tab;
        renderReadingSection();
      });
    });
    contentEl.querySelectorAll('.full-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const it = readingList(readingActive).find(x=>x.id===el.dataset.id);
        if(it) openReadingItem(it);
      });
    });
  }

  function openReadingItem(it){
    enterFullscreenTool(getEmbeddedDoc(it.file), renderReadingSection);
  }

  /* ---------- WRITING (Task 1 / Task 2 — same grid pattern, all blue) ----------
     Cards are labelled "W WRITING Tool" like Reading's Full Test cards are
     labelled "Full Test" — add more entries to WRITING_SETS as new writing
     material comes in. */
  const WRITING_SETS = {
    task1: [
      { id:'w1-1', label:'W WRITING Tool 1', file:'writing-tool.html' }
    ],
    task2: [
      { id:'w2-1', label:'W WRITING Tool 1', file:'writing-tool.html' }
    ]
  };
  const WRITING_TABS = [
    { id:'task1', label:'Task 1' },
    { id:'task2', label:'Task 2' }
  ];
  let writingActive = 'task1';

  function renderWritingSection(){
    if(!WRITING_TABS.some(t => t.id === writingActive)) writingActive = 'task1';

    const subnavHtml = `
      <div class="subnav">
        ${WRITING_TABS.map(t => `
          <button class="subnav-btn c-blue ${t.id === writingActive ? 'active' : ''}" data-tab="${t.id}">
            ${t.label}
          </button>`).join('')}
      </div>`;

    const items = WRITING_SETS[writingActive] || [];
    const body = items.length
      ? `<div class="full-list">${items.map((it,i)=>`
          <div class="full-item cycle-border-blue" data-id="${it.id}">
            <div class="fi-icon">${i+1}</div>
            <div class="fi-label">${it.label}</div>
            <div class="fi-sub">Writing</div>
          </div>`).join('')}</div>`
      : `<p style="color:var(--text-faint);font-size:.88rem;">Nothing here yet.</p>`;

    contentEl.innerHTML = `
      <div class="content-head">
        <div><h1>Writing</h1></div>
      </div>
      <div class="pane pane-fill">${subnavHtml}${body}</div>`;

    contentEl.querySelectorAll('.subnav-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        writingActive = btn.dataset.tab;
        renderWritingSection();
      });
    });
    contentEl.querySelectorAll('.full-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const it = (WRITING_SETS[writingActive] || []).find(x=>x.id===el.dataset.id);
        if(it) openWritingItem(it);
      });
    });
  }

  function openWritingItem(it){
    enterFullscreenTool(getEmbeddedDoc(it.file), renderWritingSection);
  }

  /* ---------- SKILL SECTION (with admin upload) ---------- */
  async function renderSkillSection(section){
    contentEl.innerHTML = `<div class="pane"><p style="color:var(--text-faint)">Loading…</p></div>`;
    const file = await getUpload(section);
    const admin = isAdmin();

    let body;
    if(file){
      body = `
        <div class="upload-card">
          <div class="file-row">
            <div>
              <div class="file-name">${file.name}</div>
              <div class="file-meta">uploaded ${new Date(file.uploaded_at).toLocaleString('en-GB')}</div>
            </div>
          </div>
          <div class="file-actions">
            <a class="mini-btn primary" href="${file.url}" target="_blank" rel="noopener">Open / download</a>
            ${admin ? `<button class="mini-btn" id="replaceFile">Replace</button><button class="mini-btn danger" id="removeFile">Delete</button>` : ``}
          </div>
          ${admin ? `<div class="admin-note">Stored in the cloud and visible to every visitor on any device.</div>` : ``}
        </div>`;
    } else {
      body = `<p style="color:var(--text-faint);font-size:.88rem;">Nothing here yet.</p>`;
    }

    contentEl.innerHTML = `
      <div class="content-head">
        <div>
          <h1>${LABELS[section]}</h1>
        </div>
        ${admin ? `<button class="add-btn" id="uploadPlus" title="Upload file">+</button>` : ``}
      </div>
      <div class="pane">${body}</div>
      <input type="file" id="fileInput" style="display:none">`;

    const fileInput = document.getElementById('fileInput');
    const trigger = () => fileInput.click();
    const plus = document.getElementById('uploadPlus');
    if(plus) plus.addEventListener('click', trigger);
    const replaceBtn = document.getElementById('replaceFile');
    if(replaceBtn) replaceBtn.addEventListener('click', trigger);
    const removeBtn = document.getElementById('removeFile');
    if(removeBtn) removeBtn.addEventListener('click', async ()=>{
      removeBtn.disabled = true;
      try{ await removeUpload(section); } catch(err){ alert('Could not delete: ' + err.message); }
      renderSkillSection(section);
    });

    fileInput.addEventListener('change', async (e)=>{
      const f = e.target.files[0];
      if(!f) return;
      contentEl.querySelector('.pane').innerHTML = `<p style="color:var(--text-faint)">Uploading…</p>`;
      try{
        await saveUpload(section, f);
      }catch(err){
        alert('Could not upload the file: ' + err.message);
      }
      renderSkillSection(section);
    });
  }

  /* ---------- FULL MOCK (ready-made mocks) ----------
     Same materials show up in both Full Mock (straight run-through) and
     Custom Mock (as a base you can then customize). Add entries here as
     mocks get uploaded — both views pick them up automatically. */
  const FULL_MOCKS = [
    // { id:'mock1', label:'Mock 1', file:'full-mock-1.html' }
  ];

  function renderFullMock(){
    const body = FULL_MOCKS.length
      ? `<div class="full-list">${FULL_MOCKS.map((m,i)=>`
          <div class="full-item cycle-border" data-id="${m.id}">
            <div class="fi-icon">${i+1}</div>
            <div class="fi-label">${m.label}</div>
            <div class="fi-sub">Full Mock</div>
          </div>`).join('')}</div>`
      : `<p style="color:var(--text-faint);font-size:.88rem;">Nothing here yet.</p>`;

    contentEl.innerHTML = `
      <div class="content-head">
        <div><h1>Full Mock</h1></div>
      </div>
      <div class="pane pane-fill">${body}</div>`;

    contentEl.querySelectorAll('.full-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const m = FULL_MOCKS.find(x=>x.id===el.dataset.id);
        if(m) enterFullscreenTool(getEmbeddedDoc(m.file), renderFullMock);
      });
    });
  }

  /* ---------- CUSTOM MOCK: LIST ---------- */
  function renderMockList(){
    const cards = customMocks.map(m => `
      <div class="mock-card cycle-border" data-id="${m.id}">
        <div class="name">${m.name}</div>
        <div class="meta">${summarize(m.config)}</div>
      </div>`).join('');

    contentEl.innerHTML = `
      <div class="content-head">
        <div><h1>Custom Mock</h1></div>
      </div>
      <div class="pane">
        <div class="mock-grid">
          ${cards}
          <div class="mock-card add" id="addMock">+ Create Custom Mock</div>
        </div>
      </div>`;

    document.getElementById('addMock').addEventListener('click', ()=>{
      if(FULL_MOCKS.length){ renderMockPicker(); }
      else { createCustomMock(null); }
    });

    contentEl.querySelectorAll('.mock-card[data-id]').forEach(card=>{
      card.addEventListener('click', ()=> renderMockConfig(Number(card.dataset.id)));
    });
  }

  function createCustomMock(baseId){
    mockCounter++;
    const base = FULL_MOCKS.find(m => m.id === baseId);
    const m = {
      id: mockCounter,
      name: base ? `Custom ${base.label}` : `Custom Mock ${mockCounter}`,
      baseId: base ? base.id : null,
      config: freshConfig()
    };
    customMocks.push(m);
    renderMockConfig(m.id);
  }

  /* ---------- CUSTOM MOCK: pick a base mock (same materials as Full Mock) ---------- */
  function renderMockPicker(){
    const body = `<div class="full-list">${FULL_MOCKS.map((m,i)=>`
      <div class="full-item cycle-border" data-id="${m.id}">
        <div class="fi-icon">${i+1}</div>
        <div class="fi-label">${m.label}</div>
        <div class="fi-sub">Custom Mock</div>
      </div>`).join('')}</div>`;

    contentEl.innerHTML = `
      <div class="content-head">
        <div>
          <div class="crumb" id="backToList">← Custom Mock</div>
          <h1 style="margin-top:8px;">Choose a base mock</h1>
        </div>
      </div>
      <div class="pane pane-fill">${body}</div>`;

    document.getElementById('backToList').addEventListener('click', renderMockList);
    contentEl.querySelectorAll('.full-item').forEach(el=>{
      el.addEventListener('click', ()=> createCustomMock(el.dataset.id));
    });
  }

  function summarize(cfg){
    const active = SKILLS.filter(sk => cfg[sk].some(Boolean));
    if(active.length === 0) return 'nothing selected';
    return active.map(sk => LABELS[sk]).join(' · ');
  }

  /* ---------- CUSTOM MOCK: CONFIG (unchanged customization UI) ---------- */
  function renderMockConfig(id){
    const mock = customMocks.find(m => m.id === id);
    if(!mock) return renderMockList();

    const cards = SKILLS.map(sk => skillCardHtml(sk, mock.config[sk])).join('');

    contentEl.innerHTML = `
      <div class="content-head">
        <div>
          <div class="crumb" id="backToList">← Custom Mock <span>/ ${mock.name}</span></div>
          <h1 style="margin-top:8px;">${mock.name}</h1>
        </div>
      </div>
      <div class="pane">
        <div class="config-grid" id="configGrid">${cards}</div>
        <div class="order-box">
          <h4>ORDER</h4>
          <div class="order-list" id="orderList"></div>
        </div>
        <div class="actions-row">
          <button class="btn primary" id="startMock">Start Test</button>
          <button class="btn ghost" id="renameMock">Rename</button>
        </div>
      </div>`;

    document.getElementById('backToList').addEventListener('click', renderMockList);
    document.getElementById('startMock').addEventListener('click', ()=>{
      const order = computeOrder(mock.config);
      if(order.length === 0){ alert('Pick at least one part to start.'); return; }
      const base = FULL_MOCKS.find(m => m.id === mock.baseId);
      if(base && base.file){
        enterFullscreenTool(getEmbeddedDoc(base.file), ()=>renderMockConfig(id));
      } else {
        alert('Materials not uploaded yet. Once they are, the test will run in this order:\n\n' +
          order.map((o,i)=> `${i+1}. ${LABELS[o.sk]} — ${o.parts.join(', ')}`).join('\n'));
      }
    });
    document.getElementById('renameMock').addEventListener('click', ()=>{
      const name = prompt('New name:', mock.name);
      if(name && name.trim()){ mock.name = name.trim(); renderMockConfig(id); }
    });

    bindChips(mock);
    updateOrder(mock);
  }

  function skillCardHtml(sk, activeArr){
    const disabled = !activeArr.some(Boolean);
    const chips = PARTS[sk].map((p,i)=>
      `<div class="part-chip ${activeArr[i] ? 'on':''}" data-sk="${sk}" data-idx="${i}">${p}</div>`
    ).join('');
    return `
      <div class="skill-card ${disabled ? 'disabled':''}" data-skcard="${sk}">
        <div class="sk-head">
          <div class="sk-title">${LABELS[sk]}</div>
          <div class="sk-status"></div>
        </div>
        <div class="parts">${chips}</div>
      </div>`;
  }

  function bindChips(mock){
    document.querySelectorAll('.part-chip').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const sk = chip.dataset.sk, idx = Number(chip.dataset.idx);
        mock.config[sk][idx] = !mock.config[sk][idx];
        chip.classList.toggle('on', mock.config[sk][idx]);
        const card = document.querySelector(`.skill-card[data-skcard="${sk}"]`);
        const disabled = !mock.config[sk].some(Boolean);
        card.classList.toggle('disabled', disabled);
        updateOrder(mock);
      });
    });
  }

  function computeOrder(cfg){
    return SKILLS
      .map(sk => ({ sk, parts: PARTS[sk].filter((p,i)=> cfg[sk][i]) }))
      .filter(o => o.parts.length > 0);
  }

  function updateOrder(mock){
    const order = computeOrder(mock.config);
    const list = document.getElementById('orderList');
    if(order.length === 0){
      list.innerHTML = `<div class="order-empty">Nothing selected — the test is empty.</div>`;
      return;
    }
    list.innerHTML = order.map((o,i)=> `
      <div class="order-item">
        <span class="num">${i+1}.</span>
        <span class="nm">${LABELS[o.sk]}</span>
        <span class="pt">— ${o.parts.join(', ')}</span>
      </div>`).join('');
  }

})();
</script>
</body>
</html>
