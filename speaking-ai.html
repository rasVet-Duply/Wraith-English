<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Speaking with AI — Duply</title>
<style>
  :root{
    --bg1:#0b1030; --bg2:#161d4a;
    --ai:#3d5bef; --ai-glow:rgba(61,91,239,.55);
    --human:#20c997; --human-glow:rgba(32,201,151,.55);
    --card:#ffffff; --text:#16203a; --text-dim:#5b6478;
    --danger:#e6455a;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(120% 120% at 50% -10%, var(--bg2) 0%, var(--bg1) 65%);
    color:#fff;
    min-height:100vh;
    display:flex; flex-direction:column;
    overflow:hidden;
  }

  .topbar{
    text-align:center; padding:22px 20px 6px; flex-shrink:0;
  }
  .topbar h1{
    font-size:1.3rem; font-weight:800; letter-spacing:.03em;
    background:linear-gradient(90deg,#8fa4ff,#20c997);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .topbar p{ font-size:.8rem; color:rgba(255,255,255,.55); margin-top:4px; }

  .stage{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:26px; padding:10px 20px 4px; position:relative;
  }

  /* ---------------- Orb ---------------- */
  .orb-wrap{
    position:relative; width:230px; height:230px;
    display:flex; align-items:center; justify-content:center;
  }
  .ring{
    position:absolute; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.10);
    inset:0;
  }
  .ring.r2{ inset:-24px; }
  .ring.r3{ inset:-48px; }

  .orb{
    width:150px; height:150px; border-radius:46% 54% 60% 40%/50% 45% 55% 50%;
    background:radial-gradient(circle at 32% 28%, #4a5a8a, #1a2040 72%);
    display:flex; align-items:center; justify-content:center;
    position:relative; z-index:2;
    box-shadow:0 0 40px rgba(0,0,0,.4);
    transition:box-shadow .4s ease, background .5s ease;
    animation:idleMorph 8s ease-in-out infinite;
    filter:blur(0px);
  }
  .orb::before{
    content:''; position:absolute; inset:8%; border-radius:inherit;
    background:radial-gradient(circle at 60% 70%, rgba(255,255,255,.08), transparent 60%);
  }
  .orb-icon{ display:none; }

  @keyframes idleMorph{
    0%,100%{ border-radius:46% 54% 60% 40%/50% 45% 55% 50%; }
    33%{ border-radius:58% 42% 45% 55%/40% 55% 45% 60%; }
    66%{ border-radius:42% 58% 55% 45%/58% 42% 50% 50%; }
  }

  .pulse{
    position:absolute; inset:0; border-radius:50%;
    opacity:0; z-index:1;
  }

  /* AI speaking state — cooler, layered morphing glow */
  .stage.ai-speaking .orb{
    background:radial-gradient(circle at 32% 28%, #6b83ff, var(--ai) 65%, #2233a0 100%);
    box-shadow:0 0 60px var(--ai-glow), 0 0 110px rgba(61,91,239,.25);
    animation:aiMorph 2.4s ease-in-out infinite, aiBreathe 1.05s ease-in-out infinite;
  }
  .stage.ai-speaking .pulse{
    background:radial-gradient(circle, var(--ai-glow), transparent 70%);
    animation:aiPulse 1.05s ease-out infinite;
  }
  @keyframes aiMorph{
    0%,100%{ border-radius:46% 54% 60% 40%/50% 45% 55% 50%; }
    25%{ border-radius:62% 38% 48% 52%/40% 60% 40% 60%; }
    50%{ border-radius:40% 60% 55% 45%/60% 40% 55% 45%; }
    75%{ border-radius:55% 45% 40% 60%/45% 55% 40% 60%; }
  }
  @keyframes aiBreathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.055); }
  }
  @keyframes aiPulse{
    0%{ opacity:.5; transform:scale(.9); }
    100%{ opacity:0; transform:scale(1.75); }
  }

  /* Listening / human speaking state — warm, tighter pulse tied to voice bars */
  .stage.listening .orb{
    background:radial-gradient(circle at 32% 28%, #3fe0b0, var(--human) 65%, #0d7a5c 100%);
    box-shadow:0 0 45px var(--human-glow), 0 0 90px rgba(32,201,151,.2);
    animation:idleMorph 4.5s ease-in-out infinite, humanBreathe 1.8s ease-in-out infinite;
  }
  .stage.listening .pulse{
    background:radial-gradient(circle, var(--human-glow), transparent 70%);
    animation:humanPulse 1.7s ease-out infinite;
  }
  @keyframes humanBreathe{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.025); }
  }
  @keyframes humanPulse{
    0%{ opacity:.5; transform:scale(.9); }
    100%{ opacity:0; transform:scale(1.55); }
  }

  /* Thinking state — distinct rotating gradient sweep + shimmer */
  .stage.thinking .orb{
    background:conic-gradient(from 0deg, #4a5a8a, #8fa4ff, #20c997, #4a5a8a);
    animation:thinkSpin 1.8s linear infinite, idleMorph 6s ease-in-out infinite;
    box-shadow:0 0 45px rgba(143,164,255,.35);
  }
  .stage.thinking .ring{ animation:thinkRing 2.4s linear infinite; }
  @keyframes thinkSpin{
    0%{ filter:hue-rotate(0deg) brightness(1); }
    100%{ filter:hue-rotate(360deg) brightness(1); }
  }
  @keyframes thinkRing{
    0%{ transform:rotate(0deg); opacity:.5; }
    50%{ opacity:.9; }
    100%{ transform:rotate(360deg); opacity:.5; }
  }

  /* Voice bars (reactive to mic volume while listening) */
  .bars{
    display:flex; align-items:flex-end; justify-content:center; gap:5px;
    height:46px; width:100%; max-width:260px;
  }
  .bars span{
    display:block; width:6px; min-height:5px; border-radius:4px;
    background:linear-gradient(180deg, var(--human), #0d8f6e);
    transition:height .09s ease;
    opacity:.35;
  }
  .stage.listening .bars span{ opacity:1; }

  .status-label{
    font-size:.95rem; font-weight:700; letter-spacing:.02em;
    color:rgba(255,255,255,.85);
    min-height:22px; text-align:center;
  }
  .status-sub{ font-size:.78rem; color:rgba(255,255,255,.45); text-align:center; min-height:18px; max-width:520px; }

  .transcript-box{
    width:100%; max-width:640px;
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;
    padding:14px 18px;
    font-size:.88rem;
    line-height:1.55;
    max-height:150px;
    overflow-y:auto;
    color:rgba(255,255,255,.8);
  }
  .transcript-box .tag{ font-weight:800; margin-right:6px; }
  .transcript-box .tag.ai{ color:#8fa4ff; }
  .transcript-box .tag.you{ color:#4be3b8; }
  .transcript-box .line{ margin-bottom:8px; }
  .transcript-box .line:last-child{ margin-bottom:0; }

  .controls{
    display:flex; gap:16px; justify-content:center; padding:22px 20px 30px; flex-shrink:0;
  }
  .ctrl-btn{
    border:none; border-radius:999px; padding:14px 34px;
    font-size:.95rem; font-weight:800; letter-spacing:.03em;
    cursor:pointer; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
    display:flex; align-items:center; gap:8px;
  }
  .ctrl-btn:active{ transform:scale(.96); }
  .ctrl-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .ctrl-btn.start{
    background:linear-gradient(135deg,#3d5bef,#2540c9);
    color:#fff; box-shadow:0 10px 24px -10px rgba(61,91,239,.7);
  }
  .ctrl-btn.stop{
    background:linear-gradient(135deg,#e6455a,#b81f34);
    color:#fff; box-shadow:0 10px 24px -10px rgba(230,69,90,.7);
  }

  .unsupported{
    max-width:480px; margin:auto; text-align:center; padding:30px;
    background:rgba(255,255,255,.06); border-radius:16px; font-size:.9rem; line-height:1.6;
    color:rgba(255,255,255,.85);
  }

  .type-row{
    width:100%; max-width:640px; display:flex; gap:10px;
  }
  .type-row input{
    flex:1; padding:11px 14px; border-radius:10px; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08); color:#fff; font-size:.88rem; outline:none;
  }
  .type-row input::placeholder{ color:rgba(255,255,255,.4); }
  .type-row button{
    padding:11px 18px; border:none; border-radius:10px; background:var(--ai); color:#fff;
    font-weight:700; font-size:.85rem; cursor:pointer;
  }

  .err-box{
    max-width:640px; width:100%; background:rgba(230,69,90,.15); border:1px solid rgba(230,69,90,.4);
    color:#ffd7db; border-radius:10px; padding:10px 14px; font-size:.8rem; line-height:1.5;
  }

/* === universal theme & readability fixes (auto-appended) === */
#sideMenu{ will-change: right; }
#overlay, #highlightMenu, .modal { backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }

body.theme-dark { background: var(--bg) !important; }
body.theme-dark .content-area, body.theme-dark .content-row,
body.theme-dark .wrapper, body.theme-dark .main,
body.theme-dark .left-side, body.theme-dark .right-side,
body.theme-dark .transcript-col, body.theme-dark .transcript-inner {
  background: var(--bg) !important;
}
body.theme-dark header, body.theme-dark .action-bar, body.theme-dark .passage-nav {
  background: #0f3460 !important; border-color:#2d3561 !important;
}
body.theme-dark .bubbles-area, body.theme-dark .q-card, body.theme-dark .modal-content,
body.theme-dark .modal-body, body.theme-dark .about-card, body.theme-dark .about-body,
body.theme-dark #sideMenu, body.theme-dark .menu-body, body.theme-dark .modal-footer,
body.theme-dark .drop-content, body.theme-dark #teacherAnswerBox, body.theme-dark #adminAnswerBox,
body.theme-dark #highlightMenu, body.theme-dark #removeColor, body.theme-dark #toast,
body.theme-dark .menu-footer, body.theme-dark .modal-col, body.theme-dark .proof-toast-box,

}
body.theme-dark, body.theme-dark .text-area, body.theme-dark .questions-area,
body.theme-dark .q-card, body.theme-dark .q-card p, body.theme-dark .q-card li,
body.theme-dark .description, body.theme-dark .passage-label, body.theme-dark .nav-btn,
body.theme-dark label, body.theme-dark .ans-item, body.theme-dark .attempt-tag,
body.theme-dark .settings-label, body.theme-dark .about-body p, body.theme-dark .btn-opt,
body.theme-dark .modal-header h2, body.theme-dark .modal-total, body.theme-dark .proof-note,
body.theme-dark .modal-col-title, body.theme-dark .drop-header, body.theme-dark .menu-header h2,
body.theme-dark .transcript-inner, body.theme-dark .transcript-inner p, body.theme-dark .badge,
body.theme-dark .id-status, body.theme-dark #cmdFeedback, body.theme-dark .about-top h3,
body.theme-dark .res-card {
  color: #ffffff !important;
}
body.theme-dark .input-summary, body.theme-dark .input-match, body.theme-dark input[type=text] {
  color: #ffffff !important; background: transparent !important;
}
body.theme-dark .btn-opt.selected, body.theme-dark .nav-btn.active-arrow { color: #60a5fa !important; }
body.theme-sepia .btn-opt.selected, body.theme-sepia .nav-btn.active-arrow { color: #a13a1c !important; background: #f9e6c8 !important; border-color: #a13a1c !important; font-weight: 700 !important; }
body.theme-dark .correct-neon { color:#0b3d19 !important; }
body.theme-dark .wrong-row, body.theme-dark .correct-row { color: inherit !important; }

body.theme-sepia .content-area, body.theme-sepia .content-row,
body.theme-sepia .wrapper, body.theme-sepia .main,
body.theme-sepia .left-side, body.theme-sepia .right-side,
body.theme-sepia .transcript-col, body.theme-sepia .transcript-inner {
  background: var(--bg) !important;
}
body.theme-sepia header, body.theme-sepia .action-bar, body.theme-sepia .passage-nav {
  background:#ede0c8 !important; border-color:#d4b896 !important;
}
body.theme-sepia .bubbles-area, body.theme-sepia .q-card, body.theme-sepia .modal-content,
body.theme-sepia .modal-body, body.theme-sepia .about-card, body.theme-sepia .about-body,
body.theme-sepia #sideMenu, body.theme-sepia .menu-body, body.theme-sepia .modal-footer,
body.theme-sepia .drop-content, body.theme-sepia #teacherAnswerBox, body.theme-sepia #adminAnswerBox,
body.theme-sepia #highlightMenu, body.theme-sepia #removeColor, body.theme-sepia #toast,
body.theme-sepia .menu-footer, body.theme-sepia .modal-col, body.theme-sepia .proof-toast-box,
body.theme-sepia .audio-player, body.theme-sepia .settings-panel {
  background: var(--card) !important;
}
</style>
</head>
<body>

  <div class="topbar">
    <h1>Speaking with AI</h1>
    <p>Practice spoken English with Duply</p>
  </div>

  <div class="stage" id="stage">
    <div class="orb-wrap">
      <div class="ring r3"></div>
      <div class="ring r2"></div>
      <div class="pulse"></div>
      <div class="orb"><span class="orb-icon" id="orbIcon"></span></div>
    </div>

    <div class="bars" id="bars"></div>

    <div class="status-label" id="statusLabel">Tap Start to begin</div>
    <div class="status-sub" id="statusSub"></div>

    <div class="transcript-box" id="transcriptBox">
      <div class="line" style="color:rgba(255,255,255,.4);">Your conversation will appear here</div>
    </div>

    <div class="type-row" id="typeRow">
      <input type="text" id="typeInput" placeholder="Type a reply and press Enter…">
      <button type="button" id="typeSendBtn">Send</button>
    </div>

    <div class="err-box" id="errBox" style="display:none;"></div>
  </div>

  <div class="controls">
    <button class="ctrl-btn start" id="startBtn">▶ Start</button>
    <button class="ctrl-btn stop" id="stopBtn" disabled>■ Stop</button>
  </div>

<script>
(function(){

  // ---------------- Main app (open to everyone, including guests) ----------------

  const GEMINI_API_KEY = 'AQ.Ab8RN6LTGkE6QhGreADz3J0GVjV-vTSHQn4uIUCX1jd-FrqRrw';
  const GEMINI_MODEL = 'gemini-2.5-flash';

  const stage = document.getElementById('stage');
  const statusLabel = document.getElementById('statusLabel');
  const statusSub = document.getElementById('statusSub');
  const transcriptBox = document.getElementById('transcriptBox');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const barsWrap = document.getElementById('bars');
  const errBox = document.getElementById('errBox');
  const typeInput = document.getElementById('typeInput');
  const typeSendBtn = document.getElementById('typeSendBtn');

  const GREETING = "Hi, I'm Duply! What would you like to talk about today?";

  const SYSTEM_PROMPT =
    "You are Duply, a friendly, helpful AI voice assistant having a real-time SPOKEN conversation with the " +
    "user. Reply naturally, the way a helpful person would speak out loud: keep replies conversational and " +
    "reasonably concise (they will be read aloud with text-to-speech), but you can go into more depth if the " +
    "user's request genuinely needs it. Help with whatever the user asks — answering questions, explaining " +
    "things, brainstorming, casual conversation, practising English, or anything else — just keep in mind " +
    "your responses are spoken aloud, so favour clear, natural spoken phrasing over things that only make " +
    "sense written down (like long bullet lists, code blocks, or markdown tables). " +
    "IMPORTANT: when the user asks you to DO something — e.g. 'give me feedback on my last answer', " +
    "'give me some advice', 'correct my grammar', 'summarise that', 'suggest some ideas' — actually DO IT " +
    "immediately and substantively in that same reply. Never just acknowledge the request with something " +
    "like 'Yes, I can', 'Okay', 'Sure, I can help with that' or similar and then stop — that is useless to " +
    "the user. Go straight into the actual feedback/advice/answer itself. " +
    "Note that the user's speech is transcribed automatically and may occasionally contain small recognition " +
    "errors (wrong or garbled words); use the overall context to infer their real meaning rather than reacting " +
    "literally to an obviously mistranscribed word.";

  // ---------------- State ----------------
  let active = false;
  let recognition = null;
  let recognitionRunning = false;
  let recognitionPausedForAI = false;
  let micRecognitionDisabled = false;
  let synthCancelledByUser = false;
  let history = []; // {role:'user'|'model', text:''}
  let rafId = null;

  // Buffer for stitching together speech fragments across short thinking
  // pauses (e.g. "umm... can you...") before treating it as one finished
  // turn. Without this, every brief pause the user takes gets sent to the
  // AI as its own separate message, which is why it used to reply to half
  // a sentence at a time.
  let pendingSpeech = '';
  let finalizeTimer = null;
  const SILENCE_BEFORE_SEND_MS = 1600;
  let barsEls = [];

  const BAR_COUNT = 18;
  for(let i=0;i<BAR_COUNT;i++){
    const s = document.createElement('span');
    barsWrap.appendChild(s);
    barsEls.push(s);
  }

  const SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const synth = window.speechSynthesis || { speak(){}, cancel(){}, getVoices(){ return []; }, speaking:false };
  const micSupported = !!SpeechRecognitionCtor;

  function showError(msg){
    errBox.style.display = 'block';
    errBox.textContent = msg;
  }
  function clearError(){
    errBox.style.display = 'none';
    errBox.textContent = '';
  }

  // Warm up the speech-synthesis voice list — in some browsers the very first
  // speak() call is silently ignored until voices have finished loading.
  if(window.speechSynthesis){
    synth.getVoices();
    if('onvoiceschanged' in synth){ synth.onvoiceschanged = function(){ synth.getVoices(); }; }
  }

  if(!window.speechSynthesis){
    showError('This browser does not support speech playback (speechSynthesis). Duply will still reply in text below.');
  }
  if(!window.isSecureContext){
    showError('This page is not running in a secure context (https). Voice input will not work here — you can still type your replies below.');
  }
  if(!micSupported){
    statusSub.textContent = 'Voice input is not supported in this browser — please type your replies below instead.';
  }

  function setMode(mode){ // 'idle' | 'ai-speaking' | 'listening' | 'thinking'
    stage.classList.remove('ai-speaking','listening','thinking');
    if(mode !== 'idle') stage.classList.add(mode);
    if(mode === 'ai-speaking'){ statusLabel.textContent = 'Duply is speaking'; statusSub.textContent = 'Start talking any time to interrupt'; }
    else if(mode === 'listening'){ statusLabel.textContent = 'Listening'; statusSub.textContent = 'Speak naturally'; }
    else if(mode === 'thinking'){ statusLabel.textContent = 'Thinking'; statusSub.textContent = ''; }
    else{ statusLabel.textContent = 'Tap Start to begin'; statusSub.textContent = ''; }
  }

  function addLine(who, text){
    if(transcriptBox.children.length === 1 && transcriptBox.children[0].style.color){
      transcriptBox.innerHTML = '';
    }
    const div = document.createElement('div');
    div.className = 'line';
    const tag = document.createElement('span');
    tag.className = 'tag ' + (who === 'ai' ? 'ai' : 'you');
    tag.textContent = (who === 'ai' ? 'Duply:' : 'You:');
    div.appendChild(tag);
    div.appendChild(document.createTextNode(text));
    transcriptBox.appendChild(div);
    transcriptBox.scrollTop = transcriptBox.scrollHeight;
  }

  // ---------------- Simulated voice bars ----------------
  // No longer backed by a real getUserMedia() stream — that used to compete
  // with SpeechRecognition for the microphone (only one consumer can
  // actually receive audio on many phones), which silently broke speech
  // recognition while still looking like it worked. The bars now animate
  // organically whenever we're in the "listening" state, and get a little
  // livelier while SpeechRecognition is actively reporting interim results.
  let visualizerRunning = false;
  let barsEnergy = 0.15;
  function startVisualizer(){
    if(visualizerRunning) return;
    visualizerRunning = true;
    tickVisualizer();
  }
  function tickVisualizer(){
    if(!visualizerRunning) return;
    // Energy decays toward a low idle hum, and gets bumped up by bumpVisualizer()
    // whenever the recognizer actually hears speech (see r.onresult below).
    barsEnergy = Math.max(0.1, barsEnergy * 0.9);
    for(let i=0;i<barsEls.length;i++){
      const wobble = Math.sin((Date.now()/220) + i * 0.8) * 0.5 + 0.5;
      const v = Math.min(1, barsEnergy + wobble * barsEnergy * 0.6 + Math.random()*0.05);
      barsEls[i].style.height = (5 + v * 40) + 'px';
    }
    rafId = requestAnimationFrame(tickVisualizer);
  }
  function bumpVisualizer(level){
    barsEnergy = Math.min(1, Math.max(barsEnergy, level));
  }
  function stopVisualizer(){
    visualizerRunning = false;
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
    barsEnergy = 0.15;
    barsEls.forEach(b => b.style.height = '5px');
  }

  // ---------------- Speech synthesis ----------------
  let cachedVoice = null;
  function pickVoice(){
    if(cachedVoice) return cachedVoice;
    const voices = synth.getVoices ? synth.getVoices() : [];
    if(!voices || !voices.length) return null;
    const preferredNames = [
      'Google US English', 'Google UK English Female', 'Samantha',
      'Microsoft Aria Online (Natural)', 'Microsoft Jenny Online (Natural)',
      'Microsoft Zira', 'Karen', 'Moira'
    ];
    for(const name of preferredNames){
      const v = voices.find(v => v.name === name);
      if(v){ cachedVoice = v; return v; }
    }
    const enUS = voices.find(v => v.lang === 'en-US' && !/male/i.test(v.name));
    if(enUS){ cachedVoice = enUS; return enUS; }
    const anyEn = voices.find(v => /^en/i.test(v.lang));
    if(anyEn){ cachedVoice = anyEn; return anyEn; }
    cachedVoice = voices[0];
    return cachedVoice;
  }

  function speak(text){
    if(!window.speechSynthesis){
      // No TTS available in this browser — just show the text and move on.
      return Promise.resolve(false);
    }
    return new Promise(resolve=>{
      try{
        synth.cancel();
        synthCancelledByUser = false;

        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        const voice = pickVoice();
        if(voice) utter.voice = voice;
        // A single utterance for the whole reply lets the engine's own
        // natural pausing at punctuation do the work — splitting into
        // separate utterances per sentence caused a noticeable startup
        // lag (and long pause) every time a new one began. Rate is close
        // to natural human pace: not sluggish, not rushed, with a touch
        // of per-turn variation so it doesn't sound robotic/uniform.
        utter.rate = 1.0 + (Math.random() * 0.08 - 0.02); // ~0.98–1.06
        utter.pitch = 0.98 + Math.random() * 0.08;
        utter.volume = 0.95 + Math.random() * 0.05;

        utter.onstart = ()=>{ if(active) setMode('ai-speaking'); };
        utter.onend = ()=>{ resolve(synthCancelledByUser); };
        utter.onerror = ()=>{ resolve(synthCancelledByUser); };
        synth.speak(utter);
        // Safety net for browsers that silently drop speak() requests.
        setTimeout(()=>{ if(active && !synth.speaking) resolve(synthCancelledByUser); }, 9000);
      }catch(e){
        resolve(false);
      }
    });
  }

  function interruptSpeech(){
    if(synth.speaking){
      synthCancelledByUser = true;
      synth.cancel();
    }
  }

  // ---------------- Recognition ----------------
  function createRecognition(){
    const r = new SpeechRecognitionCtor();
    r.lang = 'en-US';
    // NOTE: continuous=true is unreliable on many mobile browsers (notably
    // Android Chrome) — the mic stays "hot" (green indicator) but onresult
    // silently stops firing after the first pause. Chaining short,
    // non-continuous recognition sessions (restarted on every onend) is the
    // reliable cross-platform approach.
    r.continuous = false;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onresult = (event)=>{
      let interim = '';
      let final = '';
      for(let i = event.resultIndex; i < event.results.length; i++){
        const transcript = event.results[i][0].transcript;
        if(event.results[i].isFinal) final += transcript;
        else interim += transcript;
      }
      const heard = (interim + final).trim();
      if(heard.length > 0){
        bumpVisualizer(0.7);
      }
      // Any speech activity (even interim, not-yet-final) means the user is
      // still talking or only paused briefly to think — push the "send it"
      // timer back so we don't cut them off.
      if(heard.length > 0 && finalizeTimer){
        clearTimeout(finalizeTimer);
        finalizeTimer = setTimeout(finalizePendingSpeech, SILENCE_BEFORE_SEND_MS);
      }
      if(final.trim().length > 0){
        pendingSpeech = (pendingSpeech + ' ' + final.trim()).trim();
        if(finalizeTimer) clearTimeout(finalizeTimer);
        finalizeTimer = setTimeout(finalizePendingSpeech, SILENCE_BEFORE_SEND_MS);
      }
    };

    function finalizePendingSpeech(){
      finalizeTimer = null;
      const text = pendingSpeech.trim();
      pendingSpeech = '';
      if(text.length > 0) handleUserUtterance(text);
    }

    r.onerror = (e)=>{
      // 'no-speech' / 'aborted' are routine with chained short sessions;
      // onend below will restart the mic automatically.
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        showError('Microphone access was blocked or denied. You can still talk to Duply by typing below.');
        micRecognitionDisabled = true;
      } else if(e.error === 'audio-capture'){
        showError('No microphone was found. You can still talk to Duply by typing below.');
        micRecognitionDisabled = true;
      }
    };

    r.onend = ()=>{
      recognitionRunning = false;
      if(active && !micRecognitionDisabled && !recognitionPausedForAI){
        // Immediately start a fresh short session — this is what keeps
        // listening working continuously and reliably on mobile.
        try{ r.start(); recognitionRunning = true; }
        catch(e){ setTimeout(()=>{ if(active && !micRecognitionDisabled && !recognitionPausedForAI){ try{ r.start(); recognitionRunning = true; }catch(e2){} } }, 300); }
      }
    };

    return r;
  }

  // Mic is deliberately turned OFF while Duply is talking. Without this,
  // the recognizer picks up Duply's own voice from the speaker (especially
  // without headphones) and treats it as the user speaking — causing Duply
  // to cut itself off and effectively "talk to itself" while the real user
  // can't get a word in. We stop listening right before speak() starts and
  // resume right after it ends.
  function pauseRecognitionForAI(){
    recognitionPausedForAI = true;
    if(recognition){
      try{ recognition.stop(); }catch(e){}
    }
  }
  function resumeRecognitionAfterAI(){
    recognitionPausedForAI = false;
    if(active && recognition && !micRecognitionDisabled && !recognitionRunning){
      try{ recognition.start(); recognitionRunning = true; }catch(e){}
    }
  }

  async function handleUserUtterance(text){
    if(!active) return;
    addLine('you', text);
    setMode('thinking');
    history.push({ role:'user', text: text });

    const reply = await askGemini();
    addLine('ai', reply);
    history.push({ role:'model', text: reply });

    if(!active) return;
    setMode('ai-speaking');
    pauseRecognitionForAI();
    await speak(reply);
    resumeRecognitionAfterAI();
    if(active) setMode('listening');
  }

  async function askGemini(){
    try{
      const contents = history.map(h => ({
        role: h.role === 'user' ? 'user' : 'model',
        parts: [{ text: h.text }]
      }));

      const response = await fetch(
        'https://generativelanguage.googleapis.com/v1beta/models/' + GEMINI_MODEL + ':generateContent',
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': GEMINI_API_KEY
          },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: contents,
            generationConfig: { temperature: 0.7, maxOutputTokens: 200 }
          })
        }
      );
      const data = await response.json();
      if(data.error) throw new Error(data.error.message || 'API error');
      const text = ((((data.candidates || [])[0] || {}).content || {}).parts || [])
        .map(p => p.text || '').join(' ').trim();
      clearError();
      return text || "Sorry, could you say that again?";
    }catch(err){
      showError('Could not reach the AI service: ' + (err && err.message ? err.message : String(err)));
      return "Sorry, I'm having trouble connecting right now. Let's try again in a moment.";
    }
  }

  // ---------------- Start / Stop ----------------
  async function startSession(){
    if(active) return;
    try{
      active = true;
      micRecognitionDisabled = false;
      history = [];
      pendingSpeech = '';
      if(finalizeTimer){ clearTimeout(finalizeTimer); finalizeTimer = null; }
      transcriptBox.innerHTML = '';
      clearError();
      startBtn.disabled = true;
      stopBtn.disabled = true; // enabled once we know recognition started (or failed)

      if(!window.isSecureContext){
        showError('Microphone access requires a secure connection (https). This page seems to be open over an insecure connection (e.g. file:// or http://), so the browser will not show a microphone permission prompt at all. Host this page over https, or use the text box below to talk to Duply.');
        micRecognitionDisabled = true;
      } else if(!micSupported){
        showError('This browser does not support speech recognition. You can still talk to Duply by typing below.');
        micRecognitionDisabled = true;
      }

      stopBtn.disabled = false;

      if(micSupported && !micRecognitionDisabled){
        statusLabel.textContent = 'Requesting microphone access…';
        statusSub.textContent = 'Please allow microphone permission in the browser prompt.';
        // IMPORTANT: SpeechRecognition manages its own microphone capture and
        // its own permission prompt. Do NOT also open a separate
        // getUserMedia() stream at the same time (e.g. for a volume
        // visualizer) — on many phones only one consumer can actually read
        // the mic, so the second one silently gets nothing. That was the bug:
        // the visualizer stream "worked" (green bars moved) while it was
        // actually starving SpeechRecognition of audio, so it never returned
        // a transcript. SpeechRecognition is now the only thing touching the
        // microphone.
        recognition = createRecognition();
        try{
          recognition.start();
          recognitionRunning = true;
          startVisualizer();
        }catch(e){
          showError('Could not start voice recognition (' + (e && e.message ? e.message : e) + '). You can still type below.');
          micRecognitionDisabled = true;
        }
      }

      addLine('ai', GREETING);
      history.push({ role:'model', text: GREETING });
      setMode('ai-speaking');
      pauseRecognitionForAI();
      await speak(GREETING);
      resumeRecognitionAfterAI();
      if(active) setMode('listening');
    }catch(e){
      showError('Something went wrong starting the session: ' + (e && e.message ? e.message : e));
      stopSession();
    }
  }

  function stopSession(){
    active = false;
    startBtn.disabled = false;
    stopBtn.disabled = true;
    try{ synth.cancel(); }catch(e){}
    if(recognition){
      try{ recognition.onend = null; recognition.stop(); }catch(e){}
      recognition = null;
    }
    recognitionRunning = false;
    micRecognitionDisabled = false;
    if(finalizeTimer){ clearTimeout(finalizeTimer); finalizeTimer = null; }
    pendingSpeech = '';
    stopVisualizer();
    setMode('idle');
  }

  async function sendTyped(){
    const text = typeInput.value.trim();
    if(!text) return;
    typeInput.value = '';
    if(!active){
      // Typing works even without pressing Start first.
      active = true;
      micRecognitionDisabled = true; // typed-only mode; don't fight over the mic
      history = [];
      transcriptBox.innerHTML = '';
      startBtn.disabled = true;
      stopBtn.disabled = false;
    }
    if(synth.speaking) interruptSpeech();
    await handleUserUtterance(text);
  }

  typeSendBtn.addEventListener('click', sendTyped);
  typeInput.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); sendTyped(); }
  });

  startBtn.addEventListener('click', startSession);
  stopBtn.addEventListener('click', stopSession);

  window.addEventListener('beforeunload', stopSession);

})();
</script>
</body>
</html>
