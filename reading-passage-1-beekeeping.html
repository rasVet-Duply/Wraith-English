<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Rise of Urban Beekeeping</title>

<style>
:root{--primary:#007bff;--bg:#ffffff;--card:#ffffff;--border:#e0e0e0;--neon-green:#39FF14;--neon-red:#ff3131;--dark:#2d3436;--bar:#2d3436;--text:#444;--font-size:1.05rem;}
body.theme-dark{--bg:#1a1a2e;--card:#16213e;--border:#2d3561;--text:#ffffff;--dark:#ffffff;--bar:#0f3460;}
body.theme-dark header,body.theme-dark .action-bar{background:#0f3460;}
body.theme-dark .left-side,body.theme-dark .right-side{background:var(--bg);}
body.theme-dark .q-card{background:var(--card);border-color:var(--border);}
body.theme-dark .btn-opt{background:var(--card);color:var(--text);border-color:var(--border);}
body.theme-dark .timer{background:#0f3460;border-color:#2d3561;color:#ffffff;}
body.theme-dark .text-area{color:var(--text);background:var(--bg);}
body.theme-dark .text-area h1{color:var(--text);}
body.theme-dark .text-area p{color:var(--text);}
body.theme-dark th{background:#0f3460;color:#ffffff;}
body.theme-dark td{background:var(--card);color:var(--text);border-color:var(--border);}
body.theme-dark .settings-panel{background:#0f3460;border-color:#2d3561;}
body.theme-dark #sideMenu{background:#16213e;}
body.theme-dark .menu-header{background:var(--bar);}
body.theme-dark .menu-body{background:#16213e;}
body.theme-dark .bubbles-area{background:var(--card);border-color:var(--border);}
body.theme-dark .bubbles-area div{color:#ffffff;}
body.theme-dark .bubble{border-color:#2d3561;color:#ffffff;background:transparent;}
body.theme-dark .divider{background:#0f3460;border-color:var(--border);}
body.theme-dark .divider::after{color:#ffffff;}
body.theme-dark .input-summary{background:var(--card);color:var(--text);border-color:var(--border);}
body.theme-dark .correct-hint{color:var(--neon-green);}
body.theme-dark select.input-summary{background:var(--card);color:var(--text);border-color:var(--border);}
body.theme-dark .menu-id-box,body.theme-dark .admin-cmd-box{background:#0f3460;color:#ffffff;border-color:#2d3561;}
body.theme-dark .menu-id-box::placeholder,body.theme-dark .admin-cmd-box::placeholder{color:#8aa0c8;}
body.theme-dark .menu-star,body.theme-dark .menu-top-icon,body.theme-dark .admin-slash-icon{background:#0f3460;border-color:#2d3561;color:#ffffff;}
body.theme-dark #teacherAnswerBox{background:#0f3460;border-color:#2d3561;}
body.theme-dark #teacherAnswerBox .drop-header{color:#ffffff;}
body.theme-dark #adminAnswerBox .drop-header{color:#ffffff;}
body.theme-dark .ans-item{color:#ffffff;border-color:#2d3561;}
body.theme-dark .description{color:#ffffff;}
body.theme-dark .attempt-tag{background:#0f3460;color:#ffffff;border-color:#2d3561;}
body.theme-dark .settings-label{color:#ffffff;}
body.theme-dark #menuBtn{background:#0f3460;border-color:#2d3561;color:#ffffff;}
body.theme-dark .theme-btn{background:#16213e;border-color:#2d3561;color:#ffffff;}
body.theme-dark .theme-btn.active{background:#0f3460;border-color:var(--primary);color:#ffffff;}
body.theme-dark .btn-about{background:#16213e;border-color:#2d3561;color:#ffffff;}
body.theme-dark .passage-label{color:#ffffff;}
body.theme-dark .modal-content{background:var(--card);}
body.theme-dark .modal-header{background:var(--bar);}
body.theme-dark .modal-body{background:var(--card);}
body.theme-dark .modal-total,body.theme-dark .proof-note{color:#ffffff;}
body.theme-dark .modal-footer{background:#0f3460;}
body.theme-dark .modal-col-title{background:#0f3460;color:#ffffff;}
body.theme-dark .about-card{background:var(--card);}
body.theme-dark .about-body{background:var(--card);}
body.theme-dark .about-body p{color:#ffffff;}
body.theme-dark .about-tag{background:#0f3460;color:#ffffff;}
body.theme-dark .menu-footer{background:#16213e;border-color:#2d3561;}
body.theme-dark .tg-link{background:#0f3460;color:#ffffff;}
body.theme-dark #highlightMenu{background:#16213e;box-shadow:0 0 15px rgba(0,0,0,.6);}
body.theme-dark #removeColor{background:#0f3460;border-color:#2d3561;color:#ffffff;}
body.theme-dark #toast{background:var(--bar);color:#ffffff;}
body.theme-dark .id-status,body.theme-dark #cmdFeedback{color:#ffffff;}
body.theme-sepia{--bg:#f2e0bc;--card:#ecd6a8;--border:#d9bd85;--text:#4a3320;--dark:#4a3320;--bar:#c9975e;}
body.theme-sepia header,body.theme-sepia .action-bar{background:#c9975e;}
body.theme-sepia .left-side,body.theme-sepia .right-side{background:var(--bg);}
body.theme-sepia .q-card{background:var(--card);border-color:var(--border);}
body.theme-sepia .btn-opt{background:var(--card);color:var(--text);border-color:var(--border);}
body.theme-sepia .timer{background:#e8cf9c;border-color:var(--border);color:#4a3320;}
body.theme-sepia .text-area{color:var(--text);background:var(--bg);}
body.theme-sepia .text-area h1{color:var(--text);}
body.theme-sepia .text-area p{color:var(--text);}
body.theme-sepia th{background:#c9975e;color:#4a3320;}
body.theme-sepia td{background:var(--card);color:var(--text);border-color:var(--border);}
body.theme-sepia .settings-panel{background:#e8cf9c;border-color:var(--border);}
body.theme-sepia #sideMenu{background:var(--card);}
body.theme-sepia .menu-header{background:var(--bar);}
body.theme-sepia .menu-body{background:var(--card);}
body.theme-sepia .bubbles-area{background:var(--card);border-color:var(--border);}
body.theme-sepia .bubbles-area div{color:#4a3320;}
body.theme-sepia .bubble{border-color:var(--border);color:#8a6a3f;background:transparent;}
body.theme-sepia .bubble.active{border-color:#a9713a;color:#a9713a;background:#e8cf9c;}
body.theme-sepia .divider{background:#e8cf9c;border-color:var(--border);}
body.theme-sepia .divider::after{color:#8a6a3f;}
body.theme-sepia .input-summary{background:transparent;color:var(--text);border-color:var(--border);}
body.theme-sepia .correct-hint{color:#2d6a4f;}
body.theme-sepia select.input-summary{background:var(--card);color:var(--text);border-color:var(--border);}
body.theme-sepia .menu-id-box,body.theme-sepia .admin-cmd-box{background:#e8cf9c;color:#4a3320;border-color:var(--border);}
body.theme-sepia .menu-id-box::placeholder,body.theme-sepia .admin-cmd-box::placeholder{color:#8a6a3f;}
body.theme-sepia .menu-star,body.theme-sepia .menu-top-icon,body.theme-sepia .admin-slash-icon{background:#e8cf9c;border-color:var(--border);color:#4a3320;}
body.theme-sepia #teacherAnswerBox{background:#e8cf9c;border-color:var(--border);}
body.theme-sepia #teacherAnswerBox .drop-header{color:#4a3320;}
body.theme-sepia #adminAnswerBox .drop-header{color:#4a3320;}
body.theme-sepia .ans-item{color:#4a3320;border-color:var(--border);}
body.theme-sepia .description{color:#4a3320;}
body.theme-sepia .attempt-tag{background:#e8cf9c;color:#4a3320;border-color:var(--border);}
body.theme-sepia .settings-label{color:#4a3320;}
body.theme-sepia #menuBtn{background:#e8cf9c;border-color:var(--border);color:#4a3320;}
body.theme-sepia .theme-btn{background:var(--card);border-color:var(--border);color:#4a3320;}
body.theme-sepia .theme-btn.active{background:#e8cf9c;border-color:#a9713a;color:#4a3320;}
body.theme-sepia .btn-about{background:var(--card);border-color:var(--border);color:#4a3320;}
body.theme-sepia .passage-label{color:#4a3320;}
body.theme-sepia .modal-content{background:var(--card);}
body.theme-sepia .modal-header{background:var(--bar);}
body.theme-sepia .modal-body{background:var(--card);}
body.theme-sepia .modal-total,body.theme-sepia .proof-note{color:#4a3320;}
body.theme-sepia .modal-footer{background:#e8cf9c;}
body.theme-sepia .modal-col-title{background:#e8cf9c;color:#4a3320;}
body.theme-sepia .about-card{background:var(--card);}
body.theme-sepia .about-body{background:var(--card);}
body.theme-sepia .about-body p{color:#4a3320;}
body.theme-sepia .about-tag{background:#e8cf9c;color:#4a3320;}
body.theme-sepia .menu-footer{background:var(--card);border-color:var(--border);}
body.theme-sepia .tg-link{background:#e8cf9c;color:#4a3320;}
body.theme-sepia #highlightMenu{background:var(--card);box-shadow:0 0 15px rgba(0,0,0,.3);}
body.theme-sepia #removeColor{background:#e8cf9c;border-color:var(--border);color:#4a3320;}
body.theme-sepia #toast{background:var(--bar);color:#4a3320;}
body.theme-sepia .id-status,body.theme-sepia #cmdFeedback{color:#4a3320;}
body.theme-sepia .id-status.ok{color:#2d6a4f;}
body.theme-sepia .id-status.err{color:#a4161a;}
body.theme-sepia #proofingBtn.active{background:var(--card);color:#4a3320;border-color:#4a3320;}
*{box-sizing:border-box;}
body,html{margin:0;padding:0;height:100%;font-family:'Inter','Segoe UI',sans-serif;overflow:hidden;background:var(--bg);transition:background .3s,color .3s;}
.wrapper{display:flex;flex-direction:column;height:100vh;}
header{height:65px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 25px;flex-shrink:0;box-shadow:0 2px 10px rgba(0,0,0,.05);transition:background .3s;}
.logo{font-weight:800;font-size:1.2rem;color:var(--dark);display:flex;align-items:center;gap:10px;}
.logo i{color:var(--primary);}
.timer{font-weight:bold;background:#eef2ff;padding:8px 25px;border-radius:30px;border:1px solid #d1d9ff;color:var(--primary);font-size:1.2rem;min-width:110px;text-align:center;transition:.3s;}
#menuBtn{width:38px;height:38px;border-radius:50%;border:2px solid #dee2e6;background:#fff;font-size:1.3rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#495057;transition:.2s;}
#menuBtn:hover{background:#f0f7ff;border-color:var(--primary);color:var(--primary);}
#proofingBtn{padding:8px 18px;border-radius:30px;border:2px solid #007bff;background:#007bff;color:#fff;font-weight:700;font-size:.85rem;cursor:pointer;transition:.2s;}
#proofingBtn.active{background:#fff;color:#007bff;border-color:#007bff;}
body.theme-dark #proofingBtn.active{background:#16213e;color:#ffffff;}
.main{display:flex;flex:1;overflow:hidden;}
.left-side{width:50%;display:flex;flex-direction:column;background:#fff;border-right:1px solid var(--border);}
.text-area{flex:1;overflow-y:auto;padding:40px;line-height:1.8;color:var(--text);font-size:var(--font-size);transition:font-size .2s,color .3s;}
.text-area h1{color:var(--dark);font-size:1.8rem;margin-bottom:8px;}
.bubbles-area{height:100px;border-top:1px solid var(--border);background:#fff;padding:15px 25px;overflow-y:auto;flex-shrink:0;transition:background .3s;}
.bubbles-grid{display:flex;flex-wrap:wrap;gap:10px;}
.bubble{width:36px;height:36px;border-radius:50%;border:2px solid #dee2e6;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#adb5bd;font-size:.9rem;transition:.3s;}
.bubble.active{border-color:var(--primary);color:var(--primary);background:#eef2ff;}
.bubble.solved{background:var(--primary);color:#fff;border-color:var(--primary);}
.divider{width:12px;background:#f1f3f5;cursor:col-resize;flex-shrink:0;position:relative;border-left:1px solid #e9ecef;border-right:1px solid #e9ecef;}
.divider::after{content:'||';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#adb5bd;font-size:.8rem;letter-spacing:1px;}
.right-side{flex:1;display:flex;flex-direction:column;background:var(--bg);min-width:300px;}
.action-bar{background:#fff;border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;height:65px;flex-shrink:0;transition:background .3s;}
.attempts-row{display:flex;gap:10px;overflow-x:auto;flex:1;min-width:0;align-items:center;height:100%;}
.attempt-tag{background:#f8f9fa;border:1px solid #e9ecef;padding:8px 15px;border-radius:8px;font-size:.85rem;white-space:nowrap;color:#495057;font-weight:600;}
.btn-submit{background:var(--primary);color:#fff;border:none;padding:12px 30px;border-radius:8px;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 4px 15px rgba(0,123,255,.3);}
.btn-submit:hover{background:#0069d9;transform:translateY(-1px);}
.questions-area{flex:1;overflow-y:auto;padding:30px;font-size:var(--font-size);transition:font-size .2s;}
.q-card{background:#fff;padding:25px 30px;border-radius:12px;border:1px solid #e9ecef;margin-bottom:25px;box-shadow:0 4px 6px rgba(0,0,0,.02);transition:background .3s;}
.description{font-weight:800;color:#2d3436;margin-bottom:16px;display:block;font-size:.88rem;text-transform:uppercase;letter-spacing:.5px;border-left:5px solid var(--primary);padding-left:15px;}
.btn-opt{padding:10px 18px;border:1.5px solid #dee2e6;border-radius:8px;cursor:pointer;margin:5px 8px 5px 0;display:inline-block;background:#fff;font-weight:500;transition:.2s;}
.btn-opt.selected{border-color:var(--primary);color:var(--primary);background:#f0f7ff;}
body.theme-dark .btn-opt.selected{background:#0f3460;color:#ffffff;}
.correct-neon{border:2px solid var(--neon-green)!important;box-shadow:0 0 15px var(--neon-green)!important;background-color:#fafff5!important;pointer-events:none;}
body.theme-dark .correct-neon{background-color:#0f3460!important;color:#ffffff!important;}
.wrong-neon{border:2px solid var(--neon-red)!important;box-shadow:0 0 15px var(--neon-red)!important;}
body.theme-dark .wrong-neon{color:#ffffff!important;}
.correct-hint{display:inline-block;margin-left:10px;font-weight:800;font-size:.85rem;color:#2d6a4f;}
table{width:100%;border-collapse:collapse;margin-top:10px;}
th,td{border:1px solid #eee;padding:10px 14px;text-align:left;}
th{background:#f8f9fa;color:#6c757d;font-size:.8rem;text-transform:uppercase;font-weight:700;}
.input-summary{border:none;border-bottom:2px solid #dee2e6;width:150px;text-align:center;outline:none;font-weight:700;padding:5px;transition:.3s;background:transparent;}
.passage-nav{display:flex;align-items:center;justify-content:center;gap:16px;padding:14px 20px;border-top:1px solid #e9ecef;background:#fff;flex-shrink:0;transition:background .3s;}
body.theme-dark .passage-nav{background:#0f3460;border-color:#2d3561;}
.passage-label{font-weight:700;font-size:.9rem;color:#495057;min-width:100px;text-align:center;}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center;backdrop-filter:blur(5px);}
.modal-content{background:#fff;border-radius:20px;width:95vw;max-width:600px;text-align:center;overflow:hidden;box-shadow:0 25px 50px rgba(0,0,0,.4);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);max-height:90vh;display:flex;flex-direction:column;}
@keyframes modalIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{background:var(--bar);color:#fff;padding:20px 30px;flex-shrink:0;}
.modal-header h2{margin:0;font-size:2rem;font-weight:900;}
.modal-total{font-size:1rem;opacity:.9;margin-top:4px;color:#fff;}
.modal-body{padding:20px;background:#fff;flex:1;overflow:auto;}
.modal-col-title{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:#6c757d;margin-bottom:8px;text-align:center;padding:6px;background:#f8f9fa;border-radius:8px;}
.res-list{text-align:left;overflow-y:auto;}
.res-card{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;margin-bottom:6px;border-radius:8px;font-weight:700;font-size:.82rem;border:2px solid transparent;transition:.3s;}
.res-card.correct-row{border-color:var(--neon-green);box-shadow:0 0 8px var(--neon-green);background:#fafff5;color:#2d6a4f;}
.res-card.wrong-row{border-color:var(--neon-red);box-shadow:0 0 8px var(--neon-red);background:#fff5f5;color:#a4161a;}
.proof-note{padding:30px 10px;font-weight:700;color:#495057;font-size:1.05rem;line-height:1.6;}
.modal-footer{padding:16px 25px;background:#f8f9fa;flex-shrink:0;}
#overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;z-index:1500;backdrop-filter:blur(2px);}
#overlay.show{display:block;}
#sideMenu{position:fixed;top:0;right:-35%;width:33%;min-width:320px;height:100%;background:#fff;z-index:1600;transition:right .3s cubic-bezier(.4,0,.2,1);padding:0;box-shadow:-5px 0 30px rgba(0,0,0,.2);display:flex;flex-direction:column;overflow:hidden;}
#sideMenu.open{right:0;}
.menu-header{background:var(--bar);color:#fff;padding:25px 20px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.menu-header h2{margin:0;font-size:1.3rem;font-weight:800;}
#closeMenuBtn{background:none;border:none;color:#fff;font-size:1.4rem;cursor:pointer;padding:0;}
.menu-body{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px;}
.settings-panel{background:#f8f9fa;border:1px solid #e9ecef;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;transition:background .3s;}
.settings-label{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#6c757d;margin-bottom:4px;}
.font-slider-row{display:flex;align-items:center;gap:10px;}
.font-slider-row span{font-size:.8rem;color:#adb5bd;min-width:18px;text-align:center;}
input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:4px;background:#dee2e6;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 2px 6px rgba(0,123,255,.4);}
.theme-row{display:flex;gap:8px;}
.theme-btn{flex:1;padding:9px 6px;border-radius:10px;border:2px solid #dee2e6;cursor:pointer;font-size:.78rem;font-weight:700;transition:.2s;background:#fff;color:#495057;text-align:center;}
.theme-btn:hover{border-color:var(--primary);color:var(--primary);}
.theme-btn.active{border-color:var(--primary);background:#eef2ff;color:var(--primary);}
body.theme-dark .theme-btn.active{background:#0f3460;}
.theme-btn .tb-icon{font-size:1.1rem;display:block;margin-bottom:3px;}
.btn-about{width:100%;padding:11px;border-radius:10px;border:2px solid #dee2e6;background:#fff;cursor:pointer;font-weight:700;font-size:.85rem;color:#495057;display:flex;align-items:center;justify-content:center;gap:8px;transition:.2s;}
.btn-about:hover{border-color:var(--primary);color:var(--primary);background:#eef2ff;}
#aboutModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:2000;justify-content:center;align-items:center;backdrop-filter:blur(4px);}
#aboutModal.show{display:flex;}
.about-card{background:#fff;border-radius:20px;width:340px;max-width:90%;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.35);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);text-align:center;}
.about-top{background:linear-gradient(135deg,#007bff,#0056cc);padding:30px 20px 25px;color:#fff;}
.about-avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.25);border:3px solid rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 12px;}
.about-top h3{margin:0 0 4px;font-size:1.4rem;font-weight:900;}
.about-top p{margin:0;opacity:.8;font-size:.85rem;}
.about-body{padding:20px;}
.about-body p{color:#6c757d;font-size:.88rem;line-height:1.6;margin:0 0 14px;}
.about-tag{display:inline-block;background:#eef2ff;color:var(--primary);border-radius:20px;padding:6px 16px;font-weight:700;font-size:.85rem;margin-bottom:16px;}
.btn-close-about{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem;}
.menu-top-icon{width:44px;height:44px;border-radius:50%;border:2px solid #dee2e6;background:#f8f9fa;display:flex;align-items:center;justify-content:center;font-size:1.1rem;color:#495057;cursor:pointer;transition:.2s;align-self:flex-start;}
.menu-top-icon:hover{background:#eef2ff;border-color:var(--primary);color:var(--primary);}
.menu-mid-row{display:flex;align-items:center;gap:10px;}
.menu-star{width:44px;height:44px;border-radius:50%;border:2px solid #dee2e6;background:#f8f9fa;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:#495057;font-weight:bold;flex-shrink:0;}
.menu-id-box{flex:1;border:2px solid #dee2e6;border-radius:12px;padding:10px 14px;font-size:1rem;font-weight:600;outline:none;transition:border-color .2s;letter-spacing:2px;}
.menu-id-box:focus{border-color:var(--primary);}
.menu-id-box::placeholder{letter-spacing:0;font-weight:400;color:#adb5bd;}
.id-status{font-size:.82rem;color:#adb5bd;padding-left:4px;display:none;}
.id-status.show{display:block;}
.id-status.ok{color:#2d6a4f;}
.id-status.err{color:#a4161a;}
body.theme-dark .id-status.ok{color:#39FF14;}

const TEACHER_IDS_LIST=["004567","008245","009213"],ADMIN_ID_VAL="000000";

const passage={
  title:"The Rise of Urban Beekeeping",totalQ:13,
  text:`<h1>The Rise of Urban Beekeeping</h1><p style="font-style:italic;color:#888;font-size:.88rem;margin-bottom:16px;">Reading Passage 1 &middot; Questions 1&ndash;13</p>
<p>Twenty years ago, the idea of keeping a hive of honeybees on the roof of an office block or in a suburban back garden would have struck most people as eccentric, if not faintly alarming. Today, however, urban beekeeping has become one of the fastest-growing hobbies in cities across Europe and North America, with hives now installed on the roofs of hotels, museums, schools and corporate headquarters. What began as a niche pursuit for a handful of enthusiasts has developed into a genuine movement, driven partly by growing public concern about the decline of pollinating insects and partly by a broader appetite for locally produced food.</p>
<p>Honeybees are remarkably well suited to city life, a fact that surprises many newcomers to the practice. Urban environments typically offer a longer flowering season than the surrounding countryside, since parks, gardens and even roadside verges are planted with an enormous variety of species that bloom at different times of year. In addition, cities are usually a degree or two warmer than rural areas, an effect known as the urban heat island, which allows bees to forage for a greater number of days annually. Perhaps most importantly, urban bees are less likely to encounter the broad-spectrum pesticides that are routinely applied to large agricultural fields, since domestic gardens and public parks tend to be managed with far lighter chemical intervention.</p>
<p>None of this is to suggest that keeping bees in a city is without difficulty. Space is often the first constraint: a single hive can house tens of thousands of bees at the height of summer, and colonies require careful management to prevent overcrowding, which can trigger swarming. A swarming colony, in which roughly half the bees leave with the old queen to found a new nest, is a natural and harmless process for the bees themselves, but it can cause considerable alarm if it descends onto a crowded street or shopping precinct. Responsible urban beekeepers therefore inspect their hives regularly, adding extra boxes for the bees to expand into before overcrowding becomes a problem.</p>
<p>A further challenge lies in ensuring that urban beekeeping does not inadvertently harm the very insects it is meant to help. Some researchers have pointed out that in cities where beekeeping has become fashionable, the density of managed honeybee colonies can become so high that the bees begin to compete with wild, unmanaged pollinators &ndash; including solitary bees, bumblebees and hoverflies &ndash; for the limited supply of nectar and pollen. Because honeybees forage extremely efficiently and in large numbers, they can, in some circumstances, out-compete these other species, many of which are already under pressure from habitat loss. For this reason, several city councils and conservation groups now recommend limiting the number of hives permitted within a given area and encourage residents to plant more flowering species rather than simply adding more hives.</p>
<p>Despite these complications, most researchers agree that urban beekeeping, when carried out responsibly and in moderation, has brought real benefits. It has encouraged thousands of city dwellers to think more carefully about where their food comes from and has led to a noticeable increase in the planting of pollinator-friendly gardens and green roofs. Schools that have introduced hives report that pupils become notably more engaged with biology and environmental science, while restaurants and hotels that install rooftop hives frequently use the resulting honey as a distinctive, locally sourced ingredient. As cities continue to expand, many urban planners now argue that supporting pollinators &ndash; not only honeybees but the wider community of wild insects &ndash; should be treated as an essential part of sustainable city design, on a par with tree planting and green transport schemes.</p>`,
  questionsHTML:`<div class="q-card"><span class="description">Questions 1&ndash;6 &middot; TRUE / FALSE / NOT GIVEN</span>
<p>1. Urban beekeeping was widely practised in cities twenty years ago.</p>
<div class="q-wrap" data-q="1"><span class="btn-opt" onclick="pick(1,'TRUE',this)">TRUE</span><span class="btn-opt" onclick="pick(1,'FALSE',this)">FALSE</span><span class="btn-opt" onclick="pick(1,'NOT GIVEN',this)">NOT GIVEN</span></div>
<p>2. Cities generally provide flowers over a longer part of the year than rural areas.</p>
<div class="q-wrap" data-q="2"><span class="btn-opt" onclick="pick(2,'TRUE',this)">TRUE</span><span class="btn-opt" onclick="pick(2,'FALSE',this)">FALSE</span><span class="btn-opt" onclick="pick(2,'NOT GIVEN',this)">NOT GIVEN</span></div>
<p>3. Urban bees are exposed to more pesticides than bees kept in the countryside.</p>
<div class="q-wrap" data-q="3"><span class="btn-opt" onclick="pick(3,'TRUE',this)">TRUE</span><span class="btn-opt" onclick="pick(3,'FALSE',this)">FALSE</span><span class="btn-opt" onclick="pick(3,'NOT GIVEN',this)">NOT GIVEN</span></div>
<p>4. Swarming is dangerous to the bees that take part in it.</p>
<div class="q-wrap" data-q="4"><span class="btn-opt" onclick="pick(4,'TRUE',this)">TRUE</span><span class="btn-opt" onclick="pick(4,'FALSE',this)">FALSE</span><span class="btn-opt" onclick="pick(4,'NOT GIVEN',this)">NOT GIVEN</span></div>
<p>5. A high number of managed hives in one area can reduce food available to wild pollinators.</p>
<div class="q-wrap" data-q="5"><span class="btn-opt" onclick="pick(5,'TRUE',this)">TRUE</span><span class="btn-opt" onclick="pick(5,'FALSE',this)">FALSE</span><span class="btn-opt" onclick="pick(5,'NOT GIVEN',this)">NOT GIVEN</span></div>
<p>6. City councils have stopped issuing permits for new beehives altogether.</p>
<div class="q-wrap" data-q="6"><span class="btn-opt" onclick="pick(6,'TRUE',this)">TRUE</span><span class="btn-opt" onclick="pick(6,'FALSE',this)">FALSE</span><span class="btn-opt" onclick="pick(6,'NOT GIVEN',this)">NOT GIVEN</span></div></div>
<div class="q-card"><span class="description">Questions 7&ndash;9 &middot; Choose the correct letter A, B, C or D</span>
<p>7. According to the passage, urban areas tend to be warmer than the countryside because of</p>
<div class="q-wrap" data-q="7"><span class="btn-opt" onclick="pick(7,'A',this)">A. a lack of rainfall</span><span class="btn-opt" onclick="pick(7,'B',this)">B. the urban heat island effect</span><span class="btn-opt" onclick="pick(7,'C',this)">C. the presence of beehives</span><span class="btn-opt" onclick="pick(7,'D',this)">D. reduced plant coverage</span></div>
<p>8. Why might urban honeybees compete with wild pollinators?</p>
<div class="q-wrap" data-q="8"><span class="btn-opt" onclick="pick(8,'A',this)">A. They are larger in size</span><span class="btn-opt" onclick="pick(8,'B',this)">B. They forage in greater numbers and efficiently</span><span class="btn-opt" onclick="pick(8,'C',this)">C. They are less affected by pesticides</span><span class="btn-opt" onclick="pick(8,'D',this)">D. They fly at different times of day</span></div>
<p>9. What is one benefit of school beehive programmes mentioned in the passage?</p>
<div class="q-wrap" data-q="9"><span class="btn-opt" onclick="pick(9,'A',this)">A. Lower school fees</span><span class="btn-opt" onclick="pick(9,'B',this)">B. Increased pupil interest in biology</span><span class="btn-opt" onclick="pick(9,'C',this)">C. Reduced need for teachers</span><span class="btn-opt" onclick="pick(9,'D',this)">D. Fewer outdoor lessons</span></div></div>
<div class="q-card"><span class="description">Questions 10&ndash;13 &middot; Complete the notes (NO MORE THAN TWO WORDS)</span>
<p>A colony that becomes overcrowded may begin the natural process known as <input type="text" id="in10" class="input-summary" style="width:160px;" oninput="mark(10)"> </p>
<p>Compared with large farms, domestic gardens and parks are managed with lighter <input type="text" id="in11" class="input-summary" style="width:220px;" oninput="mark(11)"> </p>
<p>Groups now recommend limiting hive numbers and instead encourage residents to plant more <input type="text" id="in12" class="input-summary" style="width:220px;" oninput="mark(12)"> </p>
<p>Some urban planners believe supporting pollinators should be considered essential to sustainable <input type="text" id="in13" class="input-summary" style="width:180px;" oninput="mark(13)"> </p></div>`,
  correctKeys:{"1": "FALSE", "2": "TRUE", "3": "FALSE", "4": "FALSE", "5": "TRUE", "6": "NOT GIVEN", "7": "B", "8": "B", "9": "B", "10": "SWARMING", "11": "CHEMICAL INTERVENTION", "12": "FLOWERING SPECIES", "13": "CITY DESIGN"},
  teacherAnswers:["1—FALSE", "2—TRUE", "3—FALSE", "4—FALSE", "5—TRUE", "6—NOT GIVEN", "7—B", "8—B", "9—B", "10—SWARMING", "11—CHEMICAL INTERVENTION", "12—FLOWERING SPECIES", "13—CITY DESIGN"]
};

let state={studentAns:{},solvedCorrect:{}};
let totalSeconds=0,attemptCount=0,activeUserId=null,proofingMode=false,dropdownOpen=false;
let pendingReveal=false;

setInterval(()=>{totalSeconds++;if(proofingMode)return;let m=Math.floor(totalSeconds/60),s=totalSeconds%60;document.getElementById('timer').innerText=`${m<10?'0'+m:m}:${s<10?'0'+s:s}`;},1000);

const divider=document.getElementById('divider'),leftSide=document.getElementById('leftSide');
divider.onmousedown=()=>{document.onmousemove=e=>{let p=(e.clientX/window.innerWidth)*100;if(p>15&&p<85)leftSide.style.width=p+'%';};document.onmouseup=()=>document.onmousemove=null;};

function loadPassage(){
  document.getElementById('textArea').innerHTML=passage.text;
  document.getElementById('questionsArea').innerHTML=passage.questionsHTML;
  const grid=document.getElementById('bubbleGrid');grid.innerHTML='';
  Object.keys(passage.correctKeys).map(Number).forEach(i=>{
    let b=document.createElement('div');b.className='bubble';b.id='b'+i;b.innerText=i;
    if(state.solvedCorrect[i])b.classList.add('solved');else if(state.studentAns[i])b.classList.add('active');
    grid.appendChild(b);
  });
}

function pick(q,v,el){
  if(state.solvedCorrect[q])return;
  state.studentAns[q]=v;
  Array.from(el.parentNode.children).forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('b'+q).classList.add('active');
}
function mark(q){
  if(state.solvedCorrect[q])return;
  const el=document.getElementById('in'+q);
  const val=el?el.value:'';
  state.studentAns[q]=val.toUpperCase().trim()||undefined;
  document.getElementById('b'+q).classList.toggle('active',val.trim()!=='');
}

function applyNeon(q,ok,reveal){
  const key=passage.correctKeys[q];
  const el=document.getElementById('in'+q);
  if(el&&el.type!=='hidden'){
    if(ok){el.classList.add('correct-neon');el.readOnly=true;}
    else{
      el.classList.add('wrong-neon');
      if(reveal){
        el.readOnly=true;
        let hint=document.getElementById('hint'+q);
        if(!hint){hint=document.createElement('span');hint.id='hint'+q;hint.className='correct-hint';el.insertAdjacentElement('afterend',hint);}
        hint.innerText='Correct: '+key;
      }
    }
  }else{
    const wrap=document.querySelector('[data-q="'+q+'"]');
    if(wrap)Array.from(wrap.children).forEach(btn=>{
      const isSelected=btn.classList.contains('selected');
      const isCorrectBtn=btn.innerText.trim().startsWith(key);
      if(ok&&isSelected)btn.classList.add('correct-neon');
      if(!ok&&isSelected)btn.classList.add('wrong-neon');
      if(!ok&&reveal&&isCorrectBtn)btn.classList.add('correct-neon');
    });
  }
  const b=document.getElementById('b'+q);if(b&&ok)b.classList.add('solved');
}

function submitTest(){
  attemptCount++;const ts=document.getElementById('timer').innerText;
  let score=0,resHtml='';const results=[];
  Object.keys(passage.correctKeys).map(Number).forEach(i=>{
    const el=document.getElementById('in'+i);
    let ans=(state.studentAns[i]||(el&&el.type!=='hidden'?el.value:'')||'').toUpperCase().trim();
    const ok=(ans===passage.correctKeys[i]);
    if(ok){score++;state.solvedCorrect[i]=true;}
    results.push({q:i,ok});
    resHtml+=`<div class="res-card ${ok?'correct-row':'wrong-row'}"><span>Q${i}</span><span>${ok?'&#10003;':'&#10007;'}</span></div>`;
  });
  document.getElementById('attemptsRow').innerHTML+=`<div class="attempt-tag">#${attemptCount}: ${score}/${passage.totalQ} (${ts})</div>`;
  document.getElementById('attemptsRow').scrollLeft=99999;

  document.getElementById('mScore').innerText=`${score} / ${passage.totalQ}`;
  document.getElementById('modalTotal').innerText='Your score';
  document.getElementById('modalBody').innerHTML=`<div class="res-list" id="resList1">${resHtml}</div>`;

  if(proofingMode){
    pendingReveal=results;
  }else{
    results.forEach(r=>applyNeon(r.q,r.ok,false));
    pendingReveal=null;
  }
  document.getElementById('modal').style.display='flex';
}

function closeModal(){
  document.getElementById('modal').style.display='none';
  if(proofingMode&&pendingReveal){
    pendingReveal.forEach(r=>applyNeon(r.q,r.ok,true));
    pendingReveal=null;
    return;
  }
  document.querySelectorAll('.wrong-neon').forEach(el=>el.classList.remove('wrong-neon'));
}

document.getElementById('menuBtn').onclick=()=>{document.getElementById('sideMenu').classList.add('open');document.getElementById('overlay').classList.add('show');};
document.getElementById('closeMenuBtn').onclick=closeMenu;
document.getElementById('overlay').onclick=closeMenu;
function closeMenu(){document.getElementById('sideMenu').classList.remove('open');document.getElementById('overlay').classList.remove('show');}
function changeFontSize(v){document.documentElement.style.setProperty('--font-size',v+'px');document.getElementById('fontSizeLabel').innerText=v+'px';}
function setTheme(t){
  document.body.classList.remove('theme-dark','theme-sepia');
  if(t==='dark')document.body.classList.add('theme-dark');
  if(t==='sepia')document.body.classList.add('theme-sepia');
  ['themeLight','themeDark','themeSepia'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById({light:'themeLight',dark:'themeDark',sepia:'themeSepia'}[t]).classList.add('active');
}
function openAbout(){document.getElementById('aboutModal').classList.add('show');}
function closeAbout(){document.getElementById('aboutModal').classList.remove('show');}

function handleIdInput(){
  const val=document.getElementById('idInput').value.trim();
  const statusEl=document.getElementById('idStatus');
  document.getElementById('teacherAnswerBox').style.display='none';
  document.getElementById('adminRow').style.display='none';
  statusEl.className='id-status';statusEl.innerText='';activeUserId=null;
  dropdownOpen=false;
  const c=document.getElementById('dropContent0');if(c)c.classList.remove('open');
  const a=document.getElementById('dropArrow0');if(a)a.innerText='\u25bc';
  if(val.length<6)return;
  if(TEACHER_IDS_LIST.includes(val)){activeUserId='teacher';statusEl.className='id-status show ok';statusEl.innerText='Access granted \u2014 Teacher';document.getElementById('teacherAnswerBox').style.display='block';fillTeacherAnswers();document.getElementById('idInput').style.display='none';document.querySelector('.menu-star').style.display='none';}
  else if(val===ADMIN_ID_VAL){activeUserId='admin';statusEl.className='id-status show ok';statusEl.innerText='Developer access';document.getElementById('adminRow').style.display='block';fillTeacherAnswers();}
  else{statusEl.className='id-status show err';statusEl.innerText='Invalid ID';}
}
function fillTeacherAnswers(){
  const html=passage.teacherAnswers.map(v=>`<div class="ans-item">${v}</div>`).join('');
  const el0=document.getElementById('dropContent0');if(el0)el0.innerHTML=html;
  const el0b=document.getElementById('dropContent0b');if(el0b)el0b.innerHTML=html;
}
function toggleDropdown(){
  dropdownOpen=!dropdownOpen;
  ['dropContent0','dropContent0b'].forEach(id=>{const c=document.getElementById(id);if(c)c.classList.toggle('open',dropdownOpen);});
  ['dropArrow0','dropArrow0b'].forEach(id=>{const a=document.getElementById(id);if(a)a.innerText=dropdownOpen?'\u25b2':'\u25bc';});
}

function runCommand(){
  if(activeUserId!=='admin')return;
  const cmd=document.getElementById('cmdInput').value.trim().toLowerCase();
  const fb=document.getElementById('cmdFeedback');
  if(cmd==='autofill'){
    Object.keys(passage.correctKeys).map(Number).forEach(i=>{
      if(state.solvedCorrect[i])return;const key=passage.correctKeys[i];state.studentAns[i]=key;
      const el=document.getElementById('in'+i);
      if(el&&el.type!=='hidden'){el.value=key;}
      else{const wrap=document.querySelector('[data-q="'+i+'"]');if(wrap)Array.from(wrap.children).forEach(btn=>{btn.classList.remove('selected');if(btn.innerText.trim().startsWith(key))btn.classList.add('selected');});}
      const b=document.getElementById('b'+i);if(b)b.classList.add('active');
    });
    fb.className='show ok';fb.style.display='block';fb.innerText='Autofilled';showToast('Autofilled');
  } else if(cmd==='answers'){
    Object.keys(passage.correctKeys).map(Number).forEach(i=>{
      if(state.solvedCorrect[i])return;const key=passage.correctKeys[i];state.studentAns[i]=key;
      const el=document.getElementById('in'+i);
      if(el&&el.type!=='hidden'){el.value=key;el.style.color='#007bff';}
      else{const wrap=document.querySelector('[data-q="'+i+'"]');if(wrap)Array.from(wrap.children).forEach(btn=>{if(btn.innerText.trim().startsWith(key)){btn.style.background='#eef2ff';btn.style.borderColor='#007bff';btn.style.color='#007bff';}});}
    });
    fb.className='show ok';fb.style.display='block';fb.innerText='Answers revealed';showToast('Answers shown');
  } else if(cmd==='more time'){
    if(totalSeconds<=9*60){totalSeconds=0;document.getElementById('timer').innerText='00:00';fb.innerText='Reset to 0:00';showToast('Timer reset');}
    else{totalSeconds=Math.max(0,totalSeconds-600);let m=Math.floor(totalSeconds/60),sv=totalSeconds%60;document.getElementById('timer').innerText=`${m<10?'0'+m:m}:${sv<10?'0'+sv:sv}`;fb.innerText='\u221210 min';showToast('\u221210 minutes');}
    fb.className='show ok';fb.style.display='block';
  } else{fb.className='show err';fb.style.display='block';fb.innerText='Unknown command';showToast('Unknown: '+cmd);}
  document.getElementById('cmdInput').value='';
}
document.getElementById('cmdInput').addEventListener('keydown',e=>{if(e.key==='Enter')runCommand();});

function toggleProofing(){if(proofingMode)return;proofingMode=true;document.getElementById('proofingBtn').classList.add('active');document.getElementById('timer').innerText='\u221e';}

let selectedText=null;
document.addEventListener('mouseup',e=>{const sel=window.getSelection();if(sel.toString().trim().length>0){selectedText=sel.getRangeAt(0);const m=document.getElementById('highlightMenu');m.style.display='flex';m.style.left=e.pageX+'px';m.style.top=(e.pageY+15)+'px';}else document.getElementById('highlightMenu').style.display='none';});
document.querySelectorAll('.hlColor').forEach(btn=>btn.addEventListener('click',function(){if(!selectedText)return;const span=document.createElement('span');span.style.backgroundColor=this.dataset.color;try{selectedText.surroundContents(span);}catch(e){}document.getElementById('highlightMenu').style.display='none';window.getSelection().removeAllRanges();}));
document.getElementById('removeColor').addEventListener('click',()=>{if(!selectedText)return;let node=selectedText.startContainer;while(node&&node.nodeType!==1)node=node.parentNode;if(node&&node.tagName==='SPAN')node.outerHTML=node.innerHTML;document.getElementById('highlightMenu').style.display='none';window.getSelection().removeAllRanges();});

function showToast(msg){const t=document.getElementById('toast');t.innerText=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
loadPassage();
</script>
