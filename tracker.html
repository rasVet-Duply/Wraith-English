<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Трекер</title>
<style>
:root{--bg:#f3f4fb;--card:#fff;--tx:#161829;--mut:#7a7f98;--line:#e8eaf4;--pri:#6366f1;--pri2:#a855f7;--ok:#16a34a;--bad:#ef4444;--sh:0 4px 18px rgba(50,50,120,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f17;--card:#171a25;--tx:#eef0fb;--mut:#8d92ab;--line:#262a3a;--sh:0 4px 18px rgba(0,0,0,.35)}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,system-ui,sans-serif;padding-bottom:110px}
main{max-width:520px;margin:0 auto;padding:16px}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1{font-size:28px;margin:6px 0 2px;letter-spacing:-.5px}h2{font-size:17px;margin:24px 0 10px}
.sub{color:var(--mut);font-size:14px;margin:0 0 16px}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--sh);transition:transform .2s,opacity .25s}
.card.out{opacity:0;transform:translateX(40px) scale(.95)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#6366f1,#a855f7 60%,#ec4899);color:#fff;border-radius:28px;padding:22px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 12px 30px rgba(120,80,240,.35)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.14);filter:blur(2px);animation:float 8s ease-in-out infinite}
.hero::before{width:180px;height:180px;right:-50px;top:-70px}.hero::after{width:120px;height:120px;left:-30px;bottom:-60px;animation-delay:-4s}
@keyframes float{50%{transform:translate(14px,16px) scale(1.12)}}
.hero>*{position:relative;z-index:1}.hero small{opacity:.85;font-size:13px}
.big{font-size:64px;font-weight:800;line-height:1;letter-spacing:-2px}
.delta{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;margin-top:8px}
.ring{position:relative;width:104px;height:104px}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}.ring .bg{stroke:rgba(255,255,255,.25)}.ring .fg{stroke:#fff;stroke-dasharray:264;stroke-dashoffset:264;animation:ringg 1.4s .3s cubic-bezier(.3,.8,.2,1) forwards}
@keyframes ringg{to{stroke-dashoffset:var(--o)}}
.ring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1.1}.ring b{font-size:24px}.ring span{font-size:11px;opacity:.85}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;margin-top:8px;letter-spacing:-.5px}.stat span{color:var(--mut);font-size:13px}
.ib{width:36px;height:36px;border-radius:12px;background:color-mix(in srgb,var(--c,var(--pri)) 16%,transparent);color:var(--c,var(--pri));display:grid;place-items:center;font-size:20px;flex:none}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;color:#fff;margin:3px 4px 0 0}
.chip svg{font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tg{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:8px 14px;font:600 14px inherit;white-space:nowrap;transition:all .25s;cursor:pointer}
.tg.on{background:var(--c,var(--pri));border-color:var(--c,var(--pri));color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--c,var(--pri)) 40%,transparent)}
.tg:active,.btn:active,.fab:active,.step:active{transform:scale(.93)}
input,textarea{width:100%;font:16px inherit;padding:13px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--tx);outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font:700 16px inherit;padding:15px;border-radius:16px;width:100%;box-shadow:0 8px 20px rgba(99,102,241,.35);transition:transform .15s;cursor:pointer}
.ghost{background:none;border:0;color:var(--bad);font:600 14px inherit;padding:8px;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:496px;margin:0 auto;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;display:flex;padding:6px;z-index:5;box-shadow:0 10px 30px rgba(30,30,80,.15)}
.tab{flex:1;border:0;background:none;color:var(--mut);font:600 11px inherit;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;transition:color .25s}
.tab .p{width:46px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:21px;transition:all .3s cubic-bezier(.3,1.5,.5,1)}
.tab.on{color:var(--pri)}.tab.on .p{background:color-mix(in srgb,var(--pri) 16%,transparent);transform:translateY(-2px) scale(1.08)}
.fab{position:fixed;right:20px;bottom:calc(96px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-size:28px;display:grid;place-items:center;z-index:4;box-shadow:0 10px 24px rgba(99,102,241,.5);animation:pulse 2.6s infinite;transition:transform .15s,opacity .2s;cursor:pointer}
@keyframes pulse{0%{box-shadow:0 10px 24px rgba(99,102,241,.5),0 0 0 0 rgba(99,102,241,.45)}70%,100%{box-shadow:0 10px 24px rgba(99,102,241,.5),0 0 0 18px rgba(99,102,241,0)}}
.sheet{position:fixed;inset:0;background:rgba(8,8,25,.55);backdrop-filter:blur(3px);z-index:10;display:flex;align-items:flex-end;visibility:hidden;opacity:0;transition:opacity .3s,visibility .3s}
.sheet.open{visibility:visible;opacity:1}
.sheet>div{background:var(--bg);width:100%;max-width:520px;margin:0 auto;max-height:92%;overflow:auto;border-radius:28px 28px 0 0;padding:10px 16px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.sheet.open>div{transform:none}
.grab{width:42px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 5px}
.sec{background:var(--card);border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
.sec h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:10px}.sec h3 small{color:var(--mut);font-weight:500;font-size:12px;margin-left:auto}
.parts{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
details .chev{transition:transform .3s;color:var(--mut)}details[open] .chev{transform:rotate(180deg)}
details[open] .dc{animation:rise .4s both}
.score{font-size:32px;font-weight:800;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1px}
.pd{font-size:14px;color:var(--mut);margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}.pd b{color:var(--tx)}
.srow{display:flex;align-items:center;gap:12px;padding:10px 0}.srow+.srow{border-top:1px solid var(--line)}
.mb{height:6px;border-radius:6px;background:var(--line);margin-top:6px;overflow:hidden}.mb i{display:block;height:100%;border-radius:6px;width:0;animation:grow 1s .3s cubic-bezier(.3,.8,.2,1) forwards}
@keyframes grow{to{width:var(--w)}}
.w .a{color:var(--bad);text-decoration:line-through;font-weight:600}.w .b{color:var(--ok);font-weight:700}
.empty{text-align:center;color:var(--mut);padding:32px 10px}.empty .ib{width:60px;height:60px;border-radius:20px;font-size:30px;margin:0 auto 12px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.step{width:42px;height:42px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--tx);font-size:20px;display:grid;place-items:center;cursor:pointer;transition:transform .15s}
svg.ch{width:100%;height:auto;display:block}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.4,.1,.2,1) forwards}@keyframes draw{to{stroke-dashoffset:0}}
.pt{transform-box:fill-box;transform-origin:center;animation:pop .45s both;animation-delay:calc(.6s + var(--d)*80ms)}@keyframes pop{from{transform:scale(0);opacity:0}}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mut);margin-top:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
@media (hover:hover){.card:hover{transform:translateY(-2px)}.tg:hover{border-color:var(--c,var(--pri))}.btn:hover{filter:brightness(1.08)}.stat{transition:transform .2s}.stat:hover{transform:translateY(-3px)}.step:hover{border-color:var(--pri)}.ghost:hover{opacity:.7}.tab:hover{color:var(--pri)}}
@media (min-width:900px){
body{padding:0 0 40px 250px}
main{max-width:1120px;padding:32px 40px}
h1{font-size:34px}
.sub{font-size:15px;margin-bottom:22px}
.tabs{left:0;top:0;bottom:0;right:auto;width:250px;max-width:none;margin:0;border-radius:0;border:0;border-right:1px solid var(--line);flex-direction:column;justify-content:flex-start;gap:6px;padding:96px 14px 20px;backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--card);box-shadow:none}
.tabs::before{content:"IELTS Трекер";position:absolute;top:30px;left:26px;font-size:21px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,var(--pri),var(--pri2));-webkit-background-clip:text;background-clip:text;color:transparent}
.tabs::after{content:"1–4 — вкладки · N — новый тест";position:absolute;bottom:22px;left:26px;font-size:12px;color:var(--mut)}
.tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:6px 10px;border-radius:16px}
.tab .p{width:38px;height:38px;border-radius:12px}
.tab:hover{background:var(--bg)}
.tab.on{background:color-mix(in srgb,var(--pri) 12%,transparent)}.tab.on .p{background:var(--pri);color:#fff;transform:none}
.fab{right:40px;top:28px;bottom:auto;width:auto;height:50px;padding:0 22px;border-radius:16px;font-size:22px;grid-auto-flow:column;gap:10px;animation:none}
.fab::after{content:"Добавить тест";font-size:15px;font-weight:700}
.fab:hover{transform:translateY(-2px)}
#app>*{margin-bottom:0}
#app{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
#app>:first-child{grid-column:1/-1}
#app h2{margin-top:0}
.t-home>:nth-child(n+6){grid-column:1/-1}
.t-home .hero{padding:30px}.t-home .big{font-size:80px}.t-home .ring{width:128px;height:128px}.t-home .ring b{font-size:30px}
.t-home .grid{height:100%}.t-home .stat{padding:18px}
.t-home .stat b{font-size:30px}
.t-tests>.empty{grid-column:1/-1}
.t-charts>.card{grid-column:1/-1}
.t-vocab{grid-template-columns:360px minmax(0,1fr)}
.t-vocab>:nth-child(2){grid-column:1;grid-row:2/4;position:sticky;top:28px}
.t-vocab>:nth-child(3){grid-column:2;grid-row:2}
.t-vocab>:nth-child(4){grid-column:2;grid-row:3;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.t-vocab>:nth-child(4)>.card{margin:0}
.t-vocab>:nth-child(4)>.empty{grid-column:1/-1}
.sheet{align-items:center}
.sheet>div{max-width:760px;border-radius:28px;padding:26px;max-height:90vh;transform:translateY(30px) scale(.96)}
.sheet.open>div{transform:none}
.grab{display:none}
#sheetBody{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
#sheetBody>:not(.sec){grid-column:1/-1}
}
@media (min-width:1300px){.t-charts{grid-template-columns:repeat(2,minmax(0,1fr))}.t-charts>.card{grid-column:auto}.t-charts>:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Добавить тест"></button>
<nav class="tabs" id="tabs"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

<script>
const P={home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',list:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h3"/>',chart:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>',book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6"/>',plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',L:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',R:'<path d="M12 6c-2-1.5-5-2-9-2v14c4 0 7 .5 9 2 2-1.5 5-2 9-2V4c-4 0-7 .5-9 2z"/><path d="M12 6v14"/>',W:'<path d="M4 20l1-4L16 5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',S:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',O:'<path d="M12 3l2.2 6.3L21 12l-6.8 2.7L12 21l-2.2-6.3L3 12l6.8-2.7z"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',ul:'<path d="M12 16V5M7 9l5-5 5 5M5 20h14"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>',trophy:'<path d="M8 4h8v6a4 4 0 0 1-8 0zM8 6H4v1a4 4 0 0 0 4 4M16 6h4v1a4 4 0 0 1-4 4M12 14v4M8 20h8"/>',bars:'<path d="M5 20V10M12 20V4M19 20v-7"/>',check:'<path d="M5 12l5 5 9-10"/>',chev:'<path d="M6 9l6 6 6-6"/>',tests:'<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/>',words:'<path d="M4 7V5h16v2M12 5v14M9 19h6"/>'};
const ic=(n,s)=>`<svg class="i" viewBox="0 0 24 24"${s?` style="font-size:${s}px"`:""}>${P[n]}</svg>`;
const SECS={L:{n:"Listening",c:"#0ea5e9",p:["Part 1","Part 2","Part 3","Part 4"],m:[10,10,10,10],raw:true},
R:{n:"Reading",c:"#f59e0b",p:["Passage 1","Passage 2","Passage 3"],m:[13,13,14],raw:true},
W:{n:"Writing",c:"#ec4899",p:["Task 1","Task 2"],m:[9,9],raw:false},
S:{n:"Speaking",c:"#10b981",p:["Part 1","Part 2","Part 3"],m:[9,9,9],raw:false}};
const COL={O:"#6366f1",L:"#0ea5e9",R:"#f59e0b",W:"#ec4899",S:"#10b981"};
let st={tests:[],vocab:[],target:7};
try{const r=localStorage.getItem("ielts_v1");if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem("ielts_v1",JSON.stringify(st))}catch(e){}};
let tab="home",cSel={O:1,L:1,R:1,W:1,S:1},pSec="L",q="";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=id=>document.getElementById(id);
const half=x=>Math.round(x*2)/2;
function band(raw){const t=[[39,9],[37,8.5],[35,8],[33,7.5],[30,7],[27,6.5],[23,6],[19,5.5],[15,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];for(const[a,b]of t)if(raw>=a)return b;return 2}
function sec(t,k){const v=(t[k]||[]).filter(x=>x!=null);if(!v.length)return null;const sum=v.reduce((a,b)=>a+b,0);
 if(SECS[k].raw)return{raw:sum,b:band(sum)};
 if(k==="W"){const[a,b]=t.W;return{b:half((a!=null&&b!=null)?(a+2*b)/3:sum/v.length)}}
 return{b:half(sum/v.length)}}
function overall(t){const b=Object.keys(SECS).map(k=>sec(t,k)).filter(Boolean).map(x=>x.b);return b.length?half(b.reduce((a,c)=>a+c,0)/b.length):null}
const sorted=()=>[...st.tests].sort((a,b)=>a.date<b.date?-1:1);
const fmtD=d=>{const[y,m,dd]=d.split("-");return dd+"."+m+"."+y.slice(2)};
const f1=x=>x==null?"—":(Number.isInteger(x)?x+".0":x);
const cu=(v,c)=>v==null?"—":`<span class="cu" data-v="${v}">${f1(v)}</span>`;

function render(anim=true){
 $("fab").innerHTML=ic("plus");$("fab").style.display=(tab==="home"||tab==="tests")?"grid":"none";
 $("tabs").innerHTML=[["home","home","Главная"],["tests","tests","Тесты"],["charts","chart","Графики"],["vocab","book","Словарь"]]
  .map(([k,i,n])=>`<button class="tab ${tab===k?"on":""}" data-t="${k}"><span class="p">${ic(i)}</span>${n}</button>`).join("");
 $("app").className="t-"+tab;$("app").innerHTML=({home,tests,charts,vocab})[tab]();
 if(anim)[...$("app").children].forEach((el,i)=>{el.classList.add("rise");el.style.setProperty("--i",i)});
 if(tab==="charts")drawCharts();
 document.querySelectorAll(".cu").forEach(el=>{const v=parseFloat(el.dataset.v),t0=performance.now();
  (function f(t){const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3),x=v*e;el.textContent=p<1?(Number.isInteger(v)?Math.round(x):x.toFixed(1)):f1(v);if(p<1)requestAnimationFrame(f)})(t0)});
 if(anim)window.scrollTo(0,0)}

function home(){
 const ts=sorted(),last=ts[ts.length-1],ov=last?overall(last):null;
 const best=ts.reduce((m,t)=>Math.max(m,overall(t)||0),0);
 const avg=ts.length?half(ts.reduce((a,t)=>a+(overall(t)||0),0)/ts.length):null;
 const pct=ov?Math.min(1,ov/st.target):0;
 const prev=ts.length>1?overall(ts[ts.length-2]):null;
 const diff=(ov!=null&&prev!=null)?ov-prev:null;
 let h=`<div><h1>IELTS Трекер</h1><p class="sub" style="margin-bottom:12px">Следи за прогрессом тест за тестом</p></div>
 <div class="hero"><div><small>Последний тест</small><div class="big" style="margin-top:6px">${cu(ov)}</div>
 ${diff!=null&&diff!==0?`<div class="delta">${ic(diff>0?"up":"down")}${diff>0?"+":""}${diff}</div>`:ts.length>1?`<div class="delta">без изменений</div>`:""}</div>
 <div class="ring"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="42"/><circle class="fg" cx="50" cy="50" r="42" style="--o:${264*(1-pct)}"/></svg><div><b>${st.target}</b><span>цель</span></div></div></div>
 <div class="grid">
 <div class="stat"><div class="ib" style="--c:#6366f1">${ic("tests")}</div><b>${cu(ts.length)}</b><span>тестов пройдено</span></div>
 <div class="stat"><div class="ib" style="--c:#f59e0b">${ic("trophy")}</div><b>${best?cu(best):"—"}</b><span>лучший overall</span></div>
 <div class="stat"><div class="ib" style="--c:#10b981">${ic("bars")}</div><b>${cu(avg)}</b><span>средний overall</span></div>
 <div class="stat"><div class="ib" style="--c:#ec4899">${ic("words")}</div><b>${cu(st.vocab.length)}</b><span>слов в словаре</span></div></div>`;
 if(last)h+=`<div><h2>По секциям · последний тест</h2><div class="card" style="padding:6px 16px">`+Object.keys(SECS).map(k=>{const s=sec(last,k),S=SECS[k];
  return `<div class="srow"><div class="ib" style="--c:${S.c}">${ic(k)}</div><div style="flex:1"><div class="row sp"><b>${S.n}</b><b style="font-size:18px">${s?f1(s.b):"—"} ${s&&s.raw!=null?`<small style="color:var(--mut);font-weight:500;font-size:12px">${s.raw}/40</small>`:""}</b></div><div class="mb"><i style="--w:${s?s.b/9*100:0}%;background:${S.c}"></i></div></div></div>`}).join("")+`</div></div>`;
 else h+=`<div class="card empty"><div class="ib">${ic("O")}</div>Пока нет тестов.<br>Нажми «+», чтобы добавить первый</div>`;
 h+=`<div><h2>Целевой балл</h2><div class="card row sp"><div class="row"><div class="ib">${ic("target")}</div><div><b style="font-size:22px">${st.target}</b><div class="sub" style="margin:0">band, к которому идёшь</div></div></div>
 <div class="row"><button class="step" data-a="tg-" aria-label="Меньше">${ic("minus")}</button><button class="step" data-a="tg+" aria-label="Больше">${ic("plus")}</button></div></div></div>
 <div class="row"><button class="tg" data-a="exp">${ic("dl")}Бэкап</button><button class="tg" data-a="imp">${ic("ul")}Импорт</button></div><p class="sub" style="margin-top:10px">Данные хранятся в браузере телефона. Делай бэкап время от времени.</p>`;
 return h}

function tests(){
 const ts=sorted().reverse();
 let h=`<div><h1>Тесты</h1><p class="sub">Все результаты по партам</p></div>`;
 if(!ts.length)return h+`<div class="card empty"><div class="ib">${ic("tests")}</div>Список пуст.<br>Нажми «+», чтобы добавить тест</div>`;
 return h+ts.map(t=>{const o=overall(t);
  return `<details class="card"><summary><div class="row sp"><div><b>${esc(t.name||"Тест")}</b><div class="sub" style="margin:0">${fmtD(t.date)}</div></div><div class="row"><div class="score">${f1(o)}</div><span class="chev">${ic("chev",20)}</span></div></div>
  <div>${Object.keys(SECS).map(k=>{const s=sec(t,k);return s?`<span class="chip" style="background:${SECS[k].c}">${ic(k)}${f1(s.b)}</span>`:""}).join("")}</div></summary>
  <div class="dc">${Object.keys(SECS).map(k=>{const v=t[k]||[];if(!v.some(x=>x!=null))return"";return `<div class="pd"><span class="chip" style="background:${SECS[k].c}">${ic(k)}${SECS[k].n}</span><div style="margin-top:6px">${SECS[k].p.map((p,i)=>v[i]!=null?`${p}: <b>${v[i]}</b>/${SECS[k].m[i]}`:"").filter(Boolean).join(" · ")}</div></div>`}).join("")}
  <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="ghost" data-a="del" data-id="${t.id}">${ic("trash",16)}Удалить</button></div></div></details>`}).join("")}

function vocab(){
 const v=st.vocab.filter(x=>(x.w+x.r+(x.n||"")).toLowerCase().includes(q.toLowerCase()));
 return `<div><h1>Словарь ошибок</h1><p class="sub">Записывай неправильное и правильное написание</p></div>
 <div class="card"><div class="grid"><div><label>Неправильно</label><input id="vw" placeholder="clap" autocapitalize="off" autocorrect="off" spellcheck="false"></div>
 <div><label>Правильно</label><input id="vr" placeholder="club" autocapitalize="off" autocorrect="off" spellcheck="false"></div></div>
 <div style="margin:10px 0 14px"><label>Заметка (необязательно)</label><input id="vn" placeholder="перевод, правило, где ошибся"></div>
 <button class="btn" data-a="addv">${ic("plus",20)}Добавить слово</button></div>
 <div style="position:relative;margin-bottom:12px"><input id="vq" placeholder="Поиск" value="${esc(q)}" style="padding-left:42px"><span style="position:absolute;left:14px;top:14px;color:var(--mut);font-size:20px;display:flex">${ic("search")}</span></div>
 <div>${v.length?v.slice().reverse().map(x=>`<div class="card row sp w" style="padding:14px 16px;margin-bottom:8px"><div style="flex:1"><span class="a">${esc(x.w)}</span> <span style="color:var(--mut)">→</span> <span class="b">${esc(x.r)}</span>${x.n?`<div class="sub" style="margin:3px 0 0">${esc(x.n)}</div>`:""}</div><button class="ghost" data-a="delv" data-id="${x.id}" aria-label="Удалить">${ic("x",18)}</button></div>`).join(""):`<div class="card empty"><div class="ib">${ic("words")}</div>${st.vocab.length?"Ничего не найдено":"Пока пусто. Добавь первую ошибку"}</div>`}</div>`}

function charts(){
 return `<div><h1>Графики</h1><p class="sub">Динамика тест за тестом</p></div>
 <div class="card"><b>Band по тестам</b><div class="chips" style="margin-top:12px">${Object.keys(COL).map(k=>`<button class="tg ${cSel[k]?"on":""}" style="--c:${COL[k]}" data-c="${k}">${ic(k)}${k==="O"?"Overall":SECS[k].n}</button>`).join("")}</div><div id="ch1"></div></div>
 <div class="card"><b>По партам</b> <span class="sub">в % от максимума</span><div class="chips" style="margin-top:12px">${Object.keys(SECS).map(k=>`<button class="tg ${pSec===k?"on":""}" style="--c:${SECS[k].c}" data-p="${k}">${ic(k)}${SECS[k].n}</button>`).join("")}</div><div id="ch2"></div><div class="leg" id="leg2"></div></div>`}

function line(series,labels,min,max,fmt){
 const W=340,H=210,l=32,r=14,t=16,b=30,n=labels.length;
 if(!n)return `<div class="empty">Нет данных</div>`;
 const X=i=>n===1?(l+W-r)/2:l+(W-l-r)*i/(n-1),Y=v=>t+(H-t-b)*(1-(v-min)/(max-min));
 let s=`<svg class="ch" viewBox="0 0 ${W} ${H}"><defs>${series.map((se,j)=>`<linearGradient id="g${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.c}" stop-opacity=".28"/><stop offset="1" stop-color="${se.c}" stop-opacity="0"/></linearGradient>`).join("")}</defs>`;
 for(let i=0;i<=5;i++){const v=min+(max-min)*i/5,y=Y(v);s+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="${l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--mut)">${fmt(v)}</text>`}
 const every=Math.ceil(n/6);
 labels.forEach((x,i)=>{if(i%every===0||i===n-1)s+=`<text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="10" fill="var(--mut)">${x}</text>`});
 series.forEach((se,j)=>{const pts=se.v.map((v,i)=>v==null?null:[X(i),Y(v),v]).filter(Boolean);if(!pts.length)return;
  const d=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  if(se.fill&&pts.length>1)s+=`<path d="${d} L${pts[pts.length-1][0]} ${Y(min)} L${pts[0][0]} ${Y(min)}Z" fill="url(#g${j})" class="pt" style="--d:2"/>`;
  if(pts.length>1)s+=`<path class="dr" pathLength="1" d="${d}" fill="none" stroke="${se.c}" stroke-width="${se.w||2.5}" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,k)=>s+=`<circle class="pt" style="--d:${k}" cx="${p[0]}" cy="${p[1]}" r="4" fill="${se.c}" stroke="var(--card)" stroke-width="2"/>`);
  if(se.lab)pts.forEach((p,k)=>s+=`<text class="pt" style="--d:${k}" x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${se.c}">${fmt(p[2])}</text>`)});
 return s+"</svg>"}

function drawCharts(){
 const ts=sorted(),lab=ts.map(t=>fmtD(t.date).slice(0,5));
 const ser=Object.keys(COL).filter(k=>cSel[k]).map(k=>({c:COL[k],w:k==="O"?3.5:2,lab:k==="O",fill:k==="O",v:ts.map(t=>k==="O"?overall(t):(sec(t,k)||{}).b??null)}));
 const all=ser.flatMap(s=>s.v).filter(v=>v!=null);
 const min=all.length?Math.max(0,Math.floor(Math.min(...all,st.target)-1)):4;
 $("ch1").innerHTML=ts.length?line(ser,lab,min,9,v=>Number.isInteger(v)?v:v.toFixed(1)):`<div class="empty"><div class="ib">${ic("chart")}</div>Добавь тесты, чтобы увидеть график</div>`;
 const S=SECS[pSec],cols=["#6366f1","#f59e0b","#10b981","#ec4899"];
 const ps=S.p.map((p,i)=>({c:cols[i],v:ts.map(t=>{const x=(t[pSec]||[])[i];return x==null?null:Math.round(x/S.m[i]*100)})}));
 $("ch2").innerHTML=ts.length?line(ps,lab,0,100,v=>Math.round(v)+"%"):`<div class="empty">Нет данных</div>`;
 $("leg2").innerHTML=S.p.map((p,i)=>`<span><i style="background:${cols[i]}"></i>${p}</span>`).join("")}

function openForm(){
 const n=new Date(),d=n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");
 $("sheetBody").innerHTML=`<div class="grab"></div><h2 style="margin:0 0 12px;font-size:22px">Новый тест</h2>
 <div class="grid"><div><label>Название</label><input id="fn" placeholder="Cambridge 18 · Test 1"></div><div><label>Дата</label><input id="fd" type="date" value="${d}"></div></div>
 ${Object.keys(SECS).map(k=>{const S=SECS[k];return `<div class="sec"><h3><span class="ib" style="--c:${S.c}">${ic(k)}</span>${S.n}<small>${S.raw?"верных ответов":"band 0–9"}</small></h3><div class="parts">
 ${S.p.map((p,i)=>`<div><label>${p} <small>/${S.m[i]}</small></label><input data-k="${k}" data-i="${i}" type="number" inputmode="decimal" min="0" max="${S.m[i]}" step="${S.raw?1:0.5}" placeholder="–"></div>`).join("")}</div></div>`}).join("")}
 <button class="btn" data-a="savet">${ic("check",20)}Сохранить тест</button><button class="ghost" style="width:100%;justify-content:center;margin-top:8px;color:var(--mut)" data-a="close">Отмена</button>`;
 $("sheet").classList.add("open")}

function remove(el,fn){const c=el.closest(".card");c.classList.add("out");setTimeout(fn,260)}
document.addEventListener("click",e=>{
 if(e.target===$("sheet")){$("sheet").classList.remove("open");return}
 if(e.target.closest("#fab")){openForm();return}
 const el=e.target.closest("[data-t],[data-c],[data-p],[data-a]");if(!el)return;const D=el.dataset;
 if(D.t){if(tab!==D.t){tab=D.t;render()}}
 else if(D.c){cSel[D.c]=cSel[D.c]?0:1;render(false)}
 else if(D.p){pSec=D.p;render(false)}
 else if(D.a==="close")$("sheet").classList.remove("open");
 else if(D.a==="savet"){const t={id:Date.now(),date:$("fd").value,name:$("fn").value.trim()};
  Object.keys(SECS).forEach(k=>t[k]=SECS[k].p.map(()=>null));
  document.querySelectorAll("[data-k]").forEach(i=>{if(i.value!==""){const m=SECS[i.dataset.k].m[i.dataset.i];t[i.dataset.k][i.dataset.i]=Math.max(0,Math.min(m,parseFloat(i.value)))}});
  if(!t.date)t.date=new Date().toISOString().slice(0,10);
  if(!Object.keys(SECS).some(k=>t[k].some(x=>x!==null))){alert("Введи хотя бы один результат");return}
  st.tests.push(t);save();$("sheet").classList.remove("open");tab="tests";render()}
 else if(D.a==="del"){if(confirm("Удалить тест?"))remove(el,()=>{st.tests=st.tests.filter(t=>t.id!=D.id);save();render(false)})}
 else if(D.a==="tg+"||D.a==="tg-"){st.target=Math.max(4,Math.min(9,st.target+(D.a==="tg+"?.5:-.5)));save();render(false)}
 else if(D.a==="addv"){const w=$("vw").value.trim(),r=$("vr").value.trim();if(!w||!r){alert("Заполни оба поля");return}
  st.vocab.push({id:Date.now(),w,r,n:$("vn").value.trim()});save();q="";render(false)}
 else if(D.a==="delv")remove(el,()=>{st.vocab=st.vocab.filter(x=>x.id!=D.id);save();render(false)});
 else if(D.a==="exp"){const b=JSON.stringify(st);const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(b);a.download="ielts-backup.json";a.click();
  setTimeout(()=>{try{navigator.clipboard.writeText(b);alert("Бэкап скопирован в буфер обмена")}catch(x){}},200)}
 else if(D.a==="imp"){const s=prompt("Вставь текст бэкапа:");if(s){try{const o=JSON.parse(s);if(o.tests&&o.vocab){st=Object.assign(st,o);save();render()}else alert("Неверный формат")}catch(x){alert("Не удалось прочитать")}}}
});
document.addEventListener("input",e=>{if(e.target.id==="vq"){q=e.target.value;const p=e.target.selectionStart;render(false);const i=$("vq");i.focus();i.setSelectionRange(p,p)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")$("sheet").classList.remove("open");const t=e.target.tagName;if(t==="INPUT"||t==="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey)return;const m={1:"home",2:"tests",3:"charts",4:"vocab"};if(m[e.key]){if(m[e.key]!==tab){tab=m[e.key];render()}}else if("nNтТ".includes(e.key)&&e.key.length===1)openForm()});
render();
</script>
</body>
</html>
